/* ═══════════════════════════════════════════════════════ agentes ═══ */
/* Varios analistas con su propio estilo, y una tabla que dice cuál acierta.
   Lo que hace que esto sea algo más que varios prompts es la obligación de
   terminar dando probabilidades: sin números no hay tabla, y sin tabla esto
   serían opiniones mejor o peor escritas. */
V.agentes = async (raiz, [modo]) => {
  modo = modo === "quienes" ? "quienes" : "tabla";
  raiz.replaceChildren(
    el("div", { class: "titular" }, el("h1", {}, "Agentes"),
      el("div", { class: "resto fila" },
        el("div", { class: "seg" },
          el("button", { class: modo === "tabla" ? "on" : "", onclick: () => ir("#/agentes/tabla") }, "Clasificación"),
          el("button", { class: modo === "quienes" ? "on" : "", onclick: () => ir("#/agentes/quienes") }, "Quiénes son")))),
    espera("Cargando…"));

  if (modo === "tabla") {
    const d = await api.post("/api/clasificacion", {});
    raiz.lastChild.remove();
    const err = fallo(d);
    if (err) { raiz.append(err); return; }
    const filas = d.clasificacion || [];
    if (!filas.length) {
      raiz.append(tarjeta(null,
        msg(`Todavía no hay nadie con ${d.minimo} casos resueltos, que es lo mínimo `
          + "para darle un puesto a alguien.", "ojo"),
        nota("El cálculo y el mercado ya concursan solos —se apuntan cuando la "
          + "guardia prepara el día—; un agente entra en cuanto lo pongas a analizar "
          + "un partido y ese partido se juegue.")));
    } else {
      raiz.append(tarjeta("Quién acierta más",
        el("div", { class: "desliza" }, tabla(
          [{ t: "#", k: "puesto", n: true }, { t: "Quién", k: "autor" },
           { t: "Casos", k: "casos", n: true }, { t: "Ventaja", k: "ventaja", n: true },
           { t: "Brier", k: "brier", n: true },
           { t: "Dist. mercado", k: "dist", n: true },
           { t: "h. antes", k: "horas", n: true }],
          filas.map((f, i) => ({ ...f, puesto: i + 1 })),
          (f, c) => c.k === "ventaja"
            ? (f.ventaja_sobre_el_mercado === null ? "—"
                : el("b", { style: `color:var(--${f.ventaja_sobre_el_mercado > 0 ? "cesped" : "bandera"})` },
                    (f.ventaja_sobre_el_mercado > 0 ? "+" : "") + pc(f.ventaja_sobre_el_mercado, 2)))
            : c.k === "dist" ? (f.distancia_al_mercado === null ? "—" : f.distancia_al_mercado.toFixed(3))
            : c.k === "horas" ? (f.horas_antes_media === null ? "—" : f.horas_antes_media + " h")
            : c.k === "autor" ? el("b", {}, f.autor)
            : f[c.k])),
        ...(d.avisos || []).map((a) => msg(a, "ojo")),
        nota(d.como_leerlo)));
    }
    if ((d.todavia_sin_muestra || []).length) {
      raiz.append(tarjeta("Todavía sin muestra",
        el("p", { class: "peq gris" }, "Se enseñan, pero no tienen puesto: con esta "
          + "muestra el orden sería casi todo azar."),
        el("ul", { class: "lista" }, ...d.todavia_sin_muestra.map((f) => el("li", {},
          el("span", { style: "flex:1 1 160px" }, f.autor),
          el("span", { class: "gris peq" }, `${f.casos} casos, le faltan ${d.minimo - f.casos}`))))));
    }
    return;
  }

  const d = await api.post("/api/agentes", {});
  raiz.lastChild.remove();
  const err = fallo(d);
  if (err) { raiz.append(err); return; }
  const editor = el("div", {});

  const abrir = (a) => {
    const nombre = el("input", { class: "campo", value: a ? a.nombre : "" });
    const clave = el("input", { class: "campo", value: a ? a.clave : "",
      placeholder: "el-escrupuloso", disabled: !!a });
    const instrucciones = el("textarea", { class: "campo", rows: 7,
      placeholder: "Cómo quieres que mire un partido. Es lo único que lo convierte "
        + "en un agente y no en el analista de siempre con otro nombre." },
      a ? a.instrucciones : "");
    const modelo = el("input", { class: "campo", value: a ? a.modelo : "",
      placeholder: "vacío = el de los ajustes" });
    const vueltas = el("input", { class: "campo", type: "number", min: 1, max: 20,
      value: a ? a.vueltas : 6, style: "flex:0 1 90px" });
    const crudo = el("select", { class: "campo", style: "flex:0 1 210px" },
      el("option", { value: "todo" }, "con todas las estadísticas"),
      el("option", { value: "tabla" }, "con una tabla por partido"),
      el("option", { value: "no" }, "sin datos en crudo"));
    crudo.value = a ? a.crudo : "tabla";
    const activo = el("input", { type: "checkbox" });
    activo.checked = a ? a.activo : true;
    const marcadas = new Set(a ? a.herramientas : []);
    const casillas = (d.herramientas || []).map((h) => {
      const c = el("input", { type: "checkbox" });
      c.checked = marcadas.has(h);
      c.dataset.nombre = h;
      return el("label", { class: "casilla" }, c, h);
    });
    const aviso = el("div", {});

    poner(editor, tarjeta(a ? `Editar «${a.clave}»` : "Un agente nuevo",
      el("div", { class: "fila" }, el("label", { style: "flex:1 1 200px" }, "Nombre", nombre),
        el("label", { style: "flex:1 1 200px" }, "Nombre corto", clave)),
      el("label", {}, "Su estilo", instrucciones),
      el("div", { class: "fila" }, el("label", { style: "flex:1 1 200px" }, "Modelo", modelo),
        el("label", {}, "Vueltas", vueltas),
        el("label", { style: "flex:1 1 210px" }, "Expediente", crudo),
        el("label", { class: "casilla" }, activo, "activo")),
      el("details", {}, el("summary", {},
          `A qué herramientas llega (ninguna marcada = a todas las ${(d.herramientas || []).length})`),
        el("p", { class: "peq gris" }, "Esto es lo que de verdad hace distintos a dos "
          + "agentes. Uno que solo llega a los árbitros no escribe distinto: piensa "
          + "distinto, porque no sabe lo mismo."),
        el("div", { class: "sugeridas" }, ...casillas)),
      aviso,
      el("div", { class: "fila" },
        el("button", { class: "btn", onclick: async () => {
          const r = await api.post("/api/agente", { clave: clave.value.trim(), agente: {
            nombre: nombre.value, instrucciones: instrucciones.value,
            modelo: modelo.value, vueltas: Number(vueltas.value), crudo: crudo.value,
            activo: activo.checked,
            herramientas: casillas.map((l) => l.firstChild)
              .filter((c) => c.checked).map((c) => c.dataset.nombre) } });
          if (r.problemas) { poner(aviso, ...r.problemas.map((x) => msg(x, "mal"))); return; }
          const e = fallo(r);
          if (e) { poner(aviso, e); return; }
          ir("#/agentes/quienes", true);
        } }, "Guardar"),
        el("button", { class: "btn fino", onclick: () => editor.replaceChildren() }, "Dejarlo"),
        a ? el("button", { class: "btn fino", onclick: async () => {
          const r = await api.post("/api/agente/borrar", { clave: a.clave });
          const e = fallo(r);
          if (e) { poner(aviso, e); return; }
          ir("#/agentes/quienes", true);
        } }, "Borrar") : null)));
    editor.scrollIntoView({ behavior: "smooth", block: "nearest" });
  };

  raiz.append(tarjeta(null,
    el("p", { class: "peq gris" }, `${(d.agentes || []).length} agentes · ${d.fichero}`),
    el("button", { class: "btn", onclick: () => abrir(null) }, "Crear un agente")));
  raiz.append(editor);
  for (const a of d.agentes || []) {
    raiz.append(tarjeta(null,
      el("div", { class: "fila" },
        el("b", { style: "flex:1 1 auto;font-size:17px" }, a.nombre),
        a.activo ? null : etiqueta("apagado", "gris"),
        etiqueta(a.huella, "azul"),
        el("button", { class: "btn fino", onclick: () => abrir(a) }, "Editar")),
      el("p", { class: "peq gris" }, `${a.clave} · ${a.modelo || "el modelo de los ajustes"}`
        + ` · ${a.vueltas} vueltas · crudo: ${a.crudo} · `
        + (a.herramientas.length ? `${a.herramientas.length} herramientas` : "todas las herramientas")),
      el("p", {}, a.instrucciones),
      ...(a.problemas || []).map((x) => msg(x, "mal"))));
  }
  raiz.append(nota("Un agente está obligado a terminar dando probabilidades. Si no "
    + "las da, su análisis se guarda y se lee, pero no puntúa: no se puede comparar "
    + "con nadie. Que eso le pase a menudo es, en sí, información sobre él."));
};

/* En la pantalla del partido: que lo vea uno de los tuyos. */
function tarjetaAgentes(consulta) {
  const cuerpo = el("div", { class: "bloque" });
  const quien = el("select", { class: "campo", style: "flex:1 1 200px" });
  const boton = el("button", { class: "btn", type: "button" }, "Que lo vea");
  let cargados = [];

  const traer = async () => {
    const d = await api.post("/api/agentes", {});
    if (fallo(d)) return;
    cargados = (d.agentes || []).filter((a) => a.activo && !(a.problemas || []).length);
    quien.replaceChildren(...cargados.map((a) =>
      el("option", { value: a.clave }, a.nombre)));
    if (!cargados.length) {
      poner(cuerpo, nota("No tienes ningún agente listo. Se crean en la pestaña "
        + "Agentes, y lo único imprescindible es escribirle su estilo."));
      boton.disabled = true;
    }
  };

  boton.addEventListener("click", async () => {
    const elegido = cargados.find((a) => a.clave === quien.value);
    boton.disabled = true;
    boton.textContent = "Mirando…";
    cuerpo.replaceChildren(espera(`${elegido ? elegido.nombre : "El agente"} está `
      + "montando su expediente y pidiendo lo que le falta. Con varias vueltas esto "
      + "tarda; puedes irte a otra pantalla."));
    const d = await api.post("/api/agente/correr",
      { clave: quien.value, partido: String(consulta) });
    boton.disabled = false;
    boton.textContent = "Que lo vea otro";
    const err = fallo(d);
    if (err) { cuerpo.replaceChildren(err); return; }
    const p = d.probabilidades || {};
    poner(cuerpo,
      el("div", { class: "fila peq gris" }, etiqueta(d.nombre || d.agente, "azul"),
        el("span", {}, `${d.vueltas || 1} vuelta${d.vueltas === 1 ? "" : "s"}`),
        el("span", {}, `${(d.expediente || {}).tokens_aprox || "?"} tokens de expediente`),
        d.sin_numeros ? etiqueta("no puntúa", "ambar")
          : etiqueta(`${d.apuntadas} predicciones apuntadas`, "verde")),
      el("div", { class: "bloque" }, ...(d.respuesta || "").split("\n\n")
        .filter((x) => x.trim()).map((x) => el("p", {}, x))),
      p["1x2"] ? el("ul", { class: "lista" },
        el("li", {}, el("span", { style: "flex:1 1 auto" }, "Gana el local"),
          el("b", {}, pc(p["1x2"].local))),
        el("li", {}, el("span", { style: "flex:1 1 auto" }, "Empate"),
          el("b", {}, pc(p["1x2"].empate))),
        el("li", {}, el("span", { style: "flex:1 1 auto" }, "Gana el visitante"),
          el("b", {}, pc(p["1x2"].visitante)))) : null,
      (d.herramientas_pedidas || []).length
        ? el("details", {}, el("summary", {},
            `Lo que ha ido a buscar por su cuenta (${d.herramientas_pedidas.length})`),
            el("ul", { class: "lista" }, ...d.herramientas_pedidas.map((h) =>
              el("li", {}, el("code", {}, h)))))
        : null,
      d.sin_numeros
        ? msg("No ha terminado dando probabilidades, así que su análisis se guarda y "
            + "se lee, pero no entra en la clasificación: no se puede comparar con "
            + "nadie.", "ojo")
        : nota("Sus probabilidades ya están en el registro a su nombre. Cuando el "
            + "partido se juegue se resuelven solas y su puesto se mueve."));
  });

  traer();
  return tarjeta("Que lo vea…",
    el("div", { class: "fila" }, quien, boton), cuerpo,
    nota("Un agente tuyo, con su estilo y con acceso solo a los datos que le hayas "
      + "dejado. A diferencia del dictamen, este puede ir pidiendo por su cuenta lo "
      + "que vea que le falta, y termina obligado a dar sus números."));
}

V.memoria = async (raiz) => {
  raiz.replaceChildren(el("h1", {}, "Memoria"), espera());
  const e = await api.get("/api/estado");
  raiz.lastChild.remove();
  const err = fallo(e);
  if (err) {
    raiz.append(err);
    if (!e || !e.sin_clave) { raiz.append(ajustes({})); return; }
  }
  const m = e.memoria || {}, cat = e.catalogo || {};
  raiz.append(tarjeta(null,
    cifras([[m.partidos, "partidos"], [m.con_estadisticas, "con estadísticas"],
      [m.con_cuotas, "con cuotas"], [m.actuaciones, "actuaciones"], [m.tiros, "tiros"]]),
    el("p", { class: "peq gris" }, `${m.ruta || ""} · del ${m.desde || "—"} al ${m.hasta || "—"} · `
      + `último barrido: ${m.ultimo_barrido || "nunca"}`),
    Object.keys(m.ligas || {}).length
      ? el("div", { class: "fila" }, ...Object.entries(m.ligas).slice(0, 12).map((par) => etiqueta(`${par[0]} ${par[1]}`)))
      : null));

  const reg = el("div", { class: "registro", hidden: true });
  const fecha = el("input", { class: "campo", type: "date", id: "b-fecha", value: hoy(), style: "flex:0 1 148px" });
  const grupos = el("select", { class: "campo", id: "b-grupos", style: "flex:0 1 186px" },
    el("option", { value: "" }, "Todo el catálogo"),
    ...GRUPOS_UI.slice(1).map((par) => el("option", { value: par[0] }, par[1])));
  const max = el("input", { class: "campo", type: "number", id: "b-max", min: 0,
    placeholder: "Tope de peticiones", style: "flex:0 1 158px" });
  const btn = el("button", { class: "btn", type: "submit" }, "Barrer");
  async function vigilar() {
    const b = await api.get("/api/barrido");
    reg.hidden = false;
    reg.textContent = (b.lineas || []).join("\n") + (b.resumen ? "\n\n" + JSON.stringify(b.resumen, null, 1) : "");
    reg.scrollTop = reg.scrollHeight;
    btn.disabled = !!b.en_marcha;
    if (b.en_marcha) setTimeout(vigilar, 2000);
  }
  raiz.append(tarjeta("Barrido",
    el("form", { class: "busca", onsubmit: async (ev) => { ev.preventDefault(); btn.disabled = true;
      await api.post("/api/barrido", { fecha: fecha.value, grupos: grupos.value, max: Number(max.value || 0) });
      vigilar(); } }, fecha, grupos, max, btn),
    nota("Trae los partidos del día y el historial de quien juega. El primero es largo; los "
      + "siguientes casi no cuestan. Se puede cortar y seguir."),
    reg));
  if (e.barrido && (e.barrido.en_marcha || (e.barrido.lineas || []).length)) vigilar();

  const faltan = (cat.competiciones || 0) - (cat.identificadas || 0);
  raiz.append(tarjeta("Competiciones",
    el("div", { class: "fila" },
      etiqueta(`${cat.competiciones || 0} competiciones`),
      etiqueta(`${cat.masculinas || 0} masculinas`),
      etiqueta(`${cat.femeninas || 0} femeninas`, "azul"),
      etiqueta(`${cat.identificadas || 0} identificadas`, faltan ? "ambar" : "verde")),
    faltan
      ? el("div", { class: "bloque" },

    el("div", { class: "fila" },

  const cuo = el("div", { class: "bloque" });

    nota("Sin cuotas no hay favorito, y sin favorito los patrones de «casi seguro» no "

      + "el resto.")));

  const arb = el("div", {});
  const cajaArb = el("input", { class: "campo", id: "arb", placeholder: "Nombre del árbitro", autocomplete: "off" });
  raiz.append(tarjeta("Árbitro",
    el("form", { class: "busca", onsubmit: async (ev) => { ev.preventDefault();
      if (!cajaArb.value.trim()) return;
      arb.replaceChildren(espera());
      const a = await api.h("perfil_de_arbitro", { arbitro: cajaArb.value.trim() });
      if (fallo(a)) { arb.replaceChildren(fallo(a)); return; }
      arb.replaceChildren(cifras([[a.por_partido.amarillas, "amarillas"], [a.por_partido.rojas, "rojas"],
        [a.por_partido.penaltis, "penaltis"], [a.por_partido.faltas, "faltas"]]),
        el("p", { class: "peq gris" }, `${a.partidos_mirados} partidos · al local `
          + `${a.reparto_de_tarjetas.al_local}, al visitante ${a.reparto_de_tarjetas.al_visitante} · `
          + `gana el local ${a.victorias_locales}`),
        nota(a.aviso));
    } }, cajaArb, el("button", { class: "btn", type: "submit" }, "Ver")), arb));

  const libs = e.librerias || {};
  raiz.append(tarjeta("Fuentes y modelo",
    el("div", { class: "fila" }, etiqueta("sofascore", "verde"),
      ...(e.fuentes || []).map((f) => etiqueta(f, "verde")),

      const d = await api.h("fuentes", {});

      const fila = ([nombre, texto]) => el("li", {},
        el("b", { style: "width:94px;flex:none" }, nombre),

        el("ul", { class: "lista" }, ...Object.entries(d.principal || {}).map(fila),

      const d = await api.h("catalogo", { que: "todo" });
      const err = fallo(d);
      if (err) return err;
      return [nota("Todas las secciones de datos, las ligas que conoce con su id y las claves "
        + "de estadística válidas. Es el mapa completo, el mismo que ve la IA."), volcado(d)];
    })));

  raiz.append(tarjetaAjustes());
  raiz.append(tarjetaRed());

  raiz.append(ajustes(e));

/* ── conectar el móvil ───────────────────────────────────────────── */
/* El servidor manda la matriz del QR (unos y ceros) y aquí se dibuja con una
   rejilla de divs. Es más ligero que una imagen y se adapta al tema. */
function qrNodo(matriz) {
  const lado = matriz.length;
  const caja = el("div", { class: "qr", style: `grid-template-columns:repeat(${lado},1fr)`,
    role: "img", "aria-label": "Código QR con la dirección de esta página" });
  for (const fila of matriz)
    for (const v of fila) caja.append(el("i", v ? { class: "on" } : {}));
  return el("div", { class: "qr-marco" }, caja);
}

function tarjetaRed() {
  const cuerpo = el("div", { class: "bloque" });
  api.get("/api/red").then((d) => {
    const err = fallo(d);
    if (err) { cuerpo.replaceChildren(err); return; }
    if (!d.abierto_a_la_red) {
      cuerpo.replaceChildren(msg("Este servidor solo escucha en este ordenador. Arráncalo con "
        + "--lan y el móvil podrá entrar.", "ojo"),
        el("pre", { class: "registro" }, "cancha web --lan --clave loquesea"));
      return;
    }
    if (!(d.urls || []).length) {
      cuerpo.replaceChildren(msg("No se encuentra ninguna IP de red en este ordenador.", "mal"));
      return;
    }
    poner(cuerpo,
      d.qr ? qrNodo(d.qr) : null,
      el("div", { class: "fila" }, ...d.urls.map((u) =>
        el("a", { class: "eti", href: u, target: "_blank", rel: "noopener" }, u.split("//")[1].split("/")[0]))),
      nota(d.con_clave
        ? "El QR lleva la clave dentro: el móvil entra sin teclearla. La dirección viaja "
          + "por tu wifi sin cifrar, así que vale para tu casa y no para una red ajena."
        : "Sin clave: cualquiera en esta wifi puede abrirlo. Arranca con --clave si te importa."),
      nota("En iOS: Safari → Compartir → «Añadir a pantalla de inicio». En Android, "
        + "Chrome → menú → «Instalar aplicación»."));
  });
  cuerpo.append(espera("Mirando por dónde se llega…"));
  return tarjeta("Abrirlo en el móvil", cuerpo);
}

/* ── diagnóstico ─────────────────────────────────────────────────── */
function tarjetaDiagnostico() {
  const cuerpo = el("div", { class: "bloque" });
  const cajaTls = el("div", { class: "bloque" });
  async function mirarTls(boton) {
    if (boton) { boton.disabled = true; boton.textContent = "Mirando…"; }
    poner(cajaTls, espera("Mirando quién hay en medio…"));
    const d = await api.get("/api/tls");
    if (boton) { boton.disabled = false; boton.textContent = "¿Alguien abre mi HTTPS?"; }
    const err = fallo(d);
    if (err) { poner(cajaTls, err); return; }
    if (d.interceptado === null) { poner(cajaTls, msg(d.nota, "ojo")); return; }
    if (!d.interceptado) { poner(cajaTls, msg(`${d.host}: ${d.nota}`, "bien")); return; }
    poner(cajaTls, msg(`${d.host}: ${d.nota}`, "mal"),
      el("pre", { class: "registro" }, d.que_hacer || ""));
  }
  async function traer(conRed) {
    cuerpo.replaceChildren(espera(conRed ? "Preguntando a Sofascore…" : "Mirando…"));
    const d = await api.get("/api/diagnostico" + (conRed ? "?red=1" : ""));
    const err = fallo(d);
    if (err) { cuerpo.replaceChildren(err); return; }
    const c = d.cache || {}, g = d.grabaciones || {};
    poner(cuerpo,
      el("div", { class: "fila" }, ...(d.transportes || []).map((t) =>
        etiqueta(t.nombre, t.disponible ? "verde" : "hueca"))),
      el("p", { class: "peq gris" }, `En uso: `, el("b", {}, d.en_uso || "—"),
        ` · credenciales Plus: ${d.credenciales || "—"}`),
      d.aviso ? msg(d.aviso, "ojo") : null,
      (d.api || []).length ? el("ul", { class: "lista" }, ...d.api.map((x) => el("li", {},
        etiqueta(x.ok ? "ok" : String(x.http || "✗"), x.ok ? "verde" : "roja"),
        el("span", { style: "flex:1 1 180px;min-width:0" }, x.base),
        el("span", { class: "gris peq" }, x.lectura)))) : null,
      el("p", { class: "peq gris" }, c.activa
        ? `Caché: ${c.respuestas} respuestas (${c.kib} KiB) en ${c.carpeta}`
        : `Caché: ${c.nota}`),
      el("p", { class: "peq gris" }, g.grabaciones
        ? `Grabaciones: ${g.grabaciones} respuestas en ${g.carpeta} (${g.desde} → ${g.hasta})`
        : g.nota),
      el("p", { class: "peq gris" }, "Certificados: ", (d.tls || {}).lectura || "—"),
      cajaTls,
      el("div", { class: "fila" },
        el("button", { class: "btn plano s", onclick: () => traer(true) }, "Probar la API"),
        /* El HTTPS interceptado es de los fallos que más cuesta entender —el
           error habla de certificados y parece que la API esté rota— y de los
           que no se pueden mirar desde el móvil sin esto. */
        el("button", { class: "btn plano s", onclick: (ev) => mirarTls(ev.currentTarget) },
          "¿Alguien abre mi HTTPS?"),
        el("button", { class: "btn plano s", onclick: async (ev) => {
          ev.currentTarget.disabled = true;
          const r = await api.post("/api/cache", {});
          traer(false);
          if (!r.error) cuerpo.prepend(msg(`Borrados ${r.borrados} ficheros de caché.`));
        } }, "Vaciar la caché")),
      nota("Si «en uso» dice UrllibTransport, Sofascore contestará 403 casi siempre: "
        + "instala curl_cffi, que imita el TLS de Chrome."));
  }
  traer(false);
  return tarjeta("Diagnóstico", cuerpo);
}

/* ── la consola: cualquier herramienta, desde cualquier aparato ──── */
/* Las vistas de arriba cubren lo que se mira a diario. Esto cubre el resto,
   ahora y cuando se añadan más: la página pide la lista al servidor, así que
   una herramienta nueva aparece aquí sin tocar nada. */
function tarjetaConsola() {
  const cuerpo = el("div", { class: "bloque" });
  const salida = el("div", { class: "bloque" });
  api.get("/api/herramientas").then((lista) => {
    const err = fallo(lista);
    if (err || !Array.isArray(lista)) { cuerpo.replaceChildren(err || msg("Sin lista.", "mal")); return; }
    const sel = el("select", { class: "campo", style: "flex:1 1 220px" },
      ...lista.map((h) => el("option", { value: h.name }, h.name)));
    const campos = el("div", { class: "bloque" });
    const descripcion = el("p", { class: "peq gris" });
    function montar() {
      const h = lista.find((x) => x.name === sel.value) || {};
      const esquema = h.input_schema || {};
      const req = esquema.required || [];
      descripcion.textContent = h.description || "";
      campos.replaceChildren(...Object.entries(esquema.properties || {}).map(([clave, def]) =>
        el("label", { class: "bloque", style: "gap:4px" },
          el("span", { class: "mini" }, clave + (req.indexOf(clave) >= 0 ? " ·" : "")),
          def.enum
            ? el("select", { class: "campo", "data-arg": clave },
                ...(req.indexOf(clave) >= 0 ? [] : [el("option", { value: "" }, "—")]),
                ...def.enum.map((v) => el("option", { value: v }, v)))
            : el("input", { class: "campo", "data-arg": clave,
                "data-tipo": def.type || "string",
                type: def.type === "integer" || def.type === "number" ? "number" : "text",
                placeholder: def.description || "" }),
          def.enum && def.description ? el("span", { class: "peq gris" }, def.description) : null)));
      if (!Object.keys(esquema.properties || {}).length)
        campos.replaceChildren(nota("Esta herramienta no lleva argumentos."));
    }
    sel.addEventListener("change", () => { montar(); salida.replaceChildren(); });
    montar();
    poner(cuerpo,
      el("div", { class: "busca" }, sel,
        el("button", { class: "btn", onclick: async (ev) => {
          const boton = ev.currentTarget;
          boton.disabled = true;
          salida.replaceChildren(espera("Ejecutando " + sel.value + "…"));
          const args = {};
          for (const nodo of campos.querySelectorAll("[data-arg]")) {
            const v = nodo.value.trim();
            if (!v) continue;
            const tipo = nodo.dataset.tipo;
            if (tipo === "integer") args[nodo.dataset.arg] = parseInt(v, 10);
            else if (tipo === "number") args[nodo.dataset.arg] = Number(v);
            else if (tipo === "boolean") args[nodo.dataset.arg] = v === "true" || v === "sí";
            else if (tipo === "array") args[nodo.dataset.arg] = v.split(",").map((x) => x.trim());
            else args[nodo.dataset.arg] = v;
          }
          const d = await api.h(sel.value, args);
          boton.disabled = false;
          salida.replaceChildren(volcado(d));
        } }, "Ejecutar")),
      descripcion, campos, salida,
      nota(`Las ${lista.length} herramientas que ve la IA, tal cual. Lo que sale es el JSON `
        + "que recibiría ella: si algo no está en las pantallas de arriba, está aquí."));
  });
  cuerpo.append(espera("Pidiendo la lista de herramientas…"));
  return tarjeta("Consola de herramientas", cuerpo);
}

/* ── ajustes ─────────────────────────────────────────────────────── */
/* La hora de la guardia, las ligas, el modelo y el bot. Se guardan en el
   ordenador, así que cambiarlo desde el móvil lo cambia para todo. */
function tarjetaAjustes() {
  const cuerpo = el("div", { class: "bloque" });
  const avisoAjustes = el("div", { class: "bloque" });
  api.get("/api/ajustes").then((d) => {
    const err = fallo(d);
    if (err) { poner(cuerpo, err); return; }
    const a = d.ajustes, g = a.guardia, w = a.web, t = a.telegram;
    const red = a.red || {};
    const campos = {};
    const campo = (clave, etiquetaTexto, attrs, ayuda) => {
      campos[clave] = el("input", { class: "campo", ...attrs });
      return el("label", { class: "bloque", style: "gap:4px" },
        el("span", { class: "mini" }, etiquetaTexto), campos[clave],
        ayuda ? el("span", { class: "peq gris" }, ayuda) : null);
    };

    /* Las ligas: los grupos como botones y las 71 sueltas dentro de un
       plegable, porque elegir de una lista de 71 sin buscar es un castigo. */
    const elegidas = new Set((a.ligas || []).map((x) => String(x).toLowerCase()));
    const pinta = () => {
      for (const nodo of cuerpo.querySelectorAll("[data-liga]"))
        nodo.className = "sug" + (elegidas.has(nodo.dataset.liga) ? " on" : "");
      resumenLigas.textContent = elegidas.size
        ? `${elegidas.size} elegidas` : "todo el catálogo";
    };
    const alterna = (clave) => {
      if (elegidas.has(clave)) elegidas.delete(clave);
      else elegidas.add(clave);
      pinta();
    };
    const resumenLigas = el("span", { class: "gris peq" });
    const botonLiga = (clave, texto) => el("button", {
      class: "sug", "data-liga": clave, type: "button",
      onclick: () => alterna(clave) }, texto);

    /* Probar la clave de la nube sin tener que abrir un partido: pregunta por
       los modelos, que es la llamada más barata que entiende esa clave. */
    const avisoNube = el("span", { class: "peq gris" });
    let botonProbarNube = null;
    const probarNube = async () => {
      const escrita = campos.nube.value.trim();
      botonProbarNube.disabled = true;
      poner(avisoNube, espera("Preguntando a ollama.com…"));
      const r = await api.post("/api/nube", escrita ? { clave: escrita } : {});
      botonProbarNube.disabled = false;
      if (fallo(r)) { poner(avisoNube, fallo(r)); return; }
      poner(avisoNube, r.vale
        ? msg(`La clave vale. ${r.modelos} modelos en la nube.`, "bien")
        : msg(r.nota || "No vale.", "mal"));
    };

    /* Lo que pasa con el bot ahora mismo, y a quién puedes añadir. Se puede
       volver a mirar sin recargar la página ni perder lo escrito: el camino
       normal es guardar el token, escribirle al bot desde Telegram y mirar
       aquí a los pocos segundos. */
    const cajaBot = el("div", { class: "bloque" });
    const pintaBot = (datos) => {
      const e = datos.telegram_estado, vistos = datos.telegram_vistos || [];
      const puesto = (datos.ajustes.telegram || {}).token_puesto;
      const estado = !e
        ? nota("Este cancha se arrancó sin bot (o con --sin-bot).")
        : e.ultimo_error ? msg("El bot dice: " + e.ultimo_error, "mal")
        : e.escuchando ? msg("El bot está escuchando. Escríbele por Telegram.", "bien")
        : e.token_puesto ? nota("El bot arranca…")
        : msg("El bot está esperando un token. Guárdalo aquí arriba y empieza a "
            + "escuchar él solo en menos de medio minuto: no hace falta reiniciar "
            + "nada.", "ojo");
      poner(cajaBot, estado,
        vistos.length
          ? el("div", { class: "bloque" },
              el("span", { class: "peq gris" }, "Te han escrito desde:"),
              el("div", { class: "fila" }, ...vistos.map((v) =>
                el("button", { class: "sug", type: "button", onclick: () => {
                  const ya = campos.chats.value.split(",").map((x) => x.trim())
                    .filter(Boolean);
                  if (ya.indexOf(String(v.chat)) < 0) ya.push(String(v.chat));
                  campos.chats.value = ya.join(", ");
                } }, `${v.quien || "alguien"} · ${v.chat}`)),
                el("button", { class: "btn plano s", type: "button",
                  onclick: (ev) => mirarBot(ev.currentTarget) }, "Mirar otra vez")))
          : el("div", { class: "bloque" },
              el("span", { class: "peq gris" },
                puesto
                  ? "Nadie le ha escrito todavía. Escríbele por Telegram y pulsa aquí: "
                    + "te contesta con tu identificador y sale como un botón."
                  : "Guarda el token, escríbele por Telegram y pulsa aquí: te contesta "
                    + "con tu identificador de chat y sale como un botón."),
              el("button", { class: "btn plano s", style: "justify-self:start",
                type: "button", onclick: (ev) => mirarBot(ev.currentTarget) },
                "¿Me ha escrito ya?")));
    };
    const mirarBot = async (boton) => {
      if (boton) { boton.disabled = true; boton.textContent = "Mirando…"; }
      const frescos = await api.get("/api/ajustes");
      if (fallo(frescos)) { if (boton) boton.disabled = false; return; }
      pintaBot(frescos);
    };

    const porGrupo = {};
    for (const c of d.competiciones || []) (porGrupo[c.grupo] ||= []).push(c);

    poner(cuerpo,
      el("div", { class: "bloque" },
        el("div", { class: "titular" }, el("h3", {}, "Guardia nocturna"), resumenLigas),
        el("div", { class: "fila" },
          el("label", { class: "fila peq", style: "gap:6px" },
            campos.activa = el("input", { type: "checkbox", checked: g.activa }),
            el("span", {}, "encendida"))),
        campo("hora", "a qué hora", { type: "time", value: g.hora },
          "Hora local. Se coge al vuelo: no hace falta reiniciar."),
        el("div", { class: "fila" },
          el("label", { class: "bloque", style: "gap:4px;flex:1 1 120px" },
            el("span", { class: "mini" }, "qué día"),
            campos.dias = el("select", { class: "campo" },
              ...[[0, "hoy"], [1, "mañana"], [2, "pasado mañana"]].map(([v, x]) =>
                el("option", { value: v, selected: v === g.dias }, x)))),
          el("label", { class: "bloque", style: "gap:4px;flex:1 1 110px" },
            el("span", { class: "mini" }, "partidos a fondo"),
            campos.partidos = el("input", { class: "campo", type: "number", min: 0,
              value: g.partidos })),
          el("label", { class: "bloque", style: "gap:4px;flex:1 1 110px" },
            el("span", { class: "mini" }, "tope peticiones"),
            campos.max = el("input", { class: "campo", type: "number", min: 0,
              value: g.max }))),
        nota("Con 0 en el tope no hay límite. Los partidos a fondo son los que se "
          + "abastecen enteros: es lo caro y lo que llena la memoria.")),

      el("hr", { class: "hr" }),
      el("div", { class: "bloque" },
        el("h3", {}, "Ligas que sigues"),
        el("div", { class: "fila" },
          ...(d.grupos || []).map((x) => botonLiga(x.grupo, `${x.grupo} (${x.competiciones})`)),
          ...["todo", "masculino", "femenino", "europa", "america"].map((x) => botonLiga(x, x))),
        el("details", {}, el("summary", {}, "O una a una"),
          ...Object.entries(porGrupo).map(([grupo, lista]) =>
            el("div", { class: "bloque" }, el("span", { class: "mini" }, grupo),
              el("div", { class: "fila" }, ...lista.map((c) =>
                botonLiga((c.alias[0] || c.nombre).toLowerCase(), c.nombre)))))),
        el("button", { class: "btn plano s", style: "justify-self:start", type: "button",
          onclick: () => { elegidas.clear(); pinta(); } }, "Quitar todas"),
        nota("Sin ninguna elegida se sigue el catálogo entero: 71 competiciones. "
          + "Elegir menos hace las noches mucho más cortas.")),

      el("hr", { class: "hr" }),
      el("div", { class: "bloque" },
        el("h3", {}, "Analista"),
        el("label", { class: "bloque", style: "gap:4px" },
          el("span", { class: "mini" }, "modelo de ollama"),
          campos.modelo = (d.modelos || []).length
            ? el("select", { class: "campo" },
                ...((d.modelos.indexOf(a.modelo) < 0 && a.modelo)
                  ? [el("option", { value: a.modelo, selected: true },
                      `${a.modelo} (no instalado)`)] : []),
                ...d.modelos.map((m) => el("option", { value: m, selected: m === a.modelo }, m)))
            : el("input", { class: "campo", value: a.modelo,
                placeholder: "hermes3" })),
          (d.modelos || []).length
            ? nota(`${d.modelos.length} instalados en Ollama.`)
            : nota("No veo Ollama. Escribe el nombre igualmente: se usará cuando lo "
                + "arranques."),
        campo("ollama", "dónde escucha ollama", { value: a.ollama },
          "Solo se usa sin clave de nube."),
        /* El campo va VACÍO aunque haya una clave guardada, y esto no es un
           descuido: antes venía relleno con la máscara («••••••••ABCD») y quien
           pinchaba y pegaba al final acababa mandando «••••••••ABCDsk-…», que
           empieza por «•» y el servidor descarta por seguridad. Resultado: la
           clave nueva no se guardaba nunca y la pantalla seguía diciendo que
           había una. */
        campo("nube", "clave de la nube de ollama",
          { type: "password", value: "", autocomplete: "off",
            placeholder: a.ollama_api_key_puesto
              ? "hay una guardada · escribe otra para cambiarla"
              : "vacío = el modelo de tu máquina" },
          a.ollama_api_key_puesto
            ? "Déjalo vacío para no tocar la que hay. Pégala entera, sin espacios."
            : "ollama.com → Settings → API keys. Es la API key, no la clave pública."),
        el("div", { class: "fila" },
          botonProbarNube = el("button", { class: "btn plano s", type: "button",
            onclick: () => probarNube() },
            a.ollama_api_key_puesto ? "Probar la clave guardada" : "Probar la clave"),
          avisoNube)),
      el("div", { class: "bloque" },
        a.ollama_api_key_puesto
          ? msg("Con clave, el expediente de cada partido SALE de tu ordenador y "
              + "viaja a Ollama. Es la única parte de esto que no es local. Los "
              + "datos son de fútbol público, pero conviene saberlo.", "ojo")
          : nota("Sin clave todo se queda en tu máquina. Con clave puedes usar "
              + "modelos grandes que aquí no caben; mira en ollama.com cuáles hay "
              + "y a cómo están.")),

      el("hr", { class: "hr" }),
      el("div", { class: "bloque" },
        el("h3", {}, "Interfaz y bot"),
        el("div", { class: "fila" },
          el("label", { class: "bloque", style: "gap:4px;flex:1 1 110px" },
            el("span", { class: "mini" }, "puerto"),
            campos.puerto = el("input", { class: "campo", type: "number",
              value: w.puerto })),
          el("label", { class: "fila peq", style: "gap:6px" },
            campos.lan = el("input", { type: "checkbox", checked: w.lan }),
            el("span", {}, "abrir a la wifi"))),
        campo("clave", "clave de la interfaz", { type: "password", value: w.clave },
          "Recomendable si la abres a la wifi. Va dentro del QR."),
        campo("token", "token del bot de telegram",
          { type: "password", value: "", autocomplete: "off",
            placeholder: t.token_puesto
              ? "hay uno guardado · escribe otro para cambiarlo" : "123456:AAE…" },
          t.token_puesto ? "Déjalo vacío para no tocar el que hay."
            : "Te lo da @BotFather en Telegram con /newbot."),
        campo("chats", "chats permitidos", { value: (t.chats || []).join(", ") }),
        /* El identificador de chat es un número que nadie se sabe. En vez de
           pedirlo a secas se explican los pasos, se dice si el bot está
           escuchando de verdad —«le escribo y no hace nada» era casi siempre
           eso— y se ofrece de un botón a quien ya le haya escrito. */
        cajaBot,
        nota("Sin ningún chat permitido el bot no contesta a nadie, y es a "
          + "propósito: cualquiera que dé con su nombre puede escribirle."),
        nota("El token y los chats se cogen al vuelo: el bot mira los ajustes cada "
          + "medio minuto. El puerto, la clave y la wifi sí piden reiniciar.")),

      el("hr", { class: "hr" }),
      el("div", { class: "bloque" },
        el("h3", {}, "Certificados"),
        nota("Solo hace falta tocar esto si algo está abriendo tu HTTPS por el "
          + "camino: un antivirus que «revisa webs seguras», el proxy de una "
          + "empresa o un colegio, o una VPN. Se nota porque nada se conecta y el "
          + "error habla de certificados. En Memoria → Diagnóstico, el botón "
          + "«¿Alguien abre mi HTTPS?» dice quién es."),
        campo("ca", "fichero de certificados (.pem)", { value: red.ca_bundle || "",
          placeholder: "vacío = los del sistema" },
          "Lo normal es no necesitarlo: pip install truststore lo arregla casi "
          + "siempre, porque entonces se usa el almacén de Windows."),
        el("label", { class: "fila peq", style: "gap:6px" },
          campos.sinVerificar = el("input", { type: "checkbox",
            checked: !!red.sin_verificar }),
          el("span", {}, "no comprobar con quién hablo")),
        red.sin_verificar
          ? msg("Ahora mismo no se comprueba con quién se habla. Funciona, pero "
              + "cualquiera que se ponga en medio puede leer y cambiar lo que pasa "
              + "por ahí, incluido el token del bot. Es el último recurso.", "mal")
          : nota("Último recurso, y solo si sabes lo que hay en medio.")),

      el("hr", { class: "hr" }),
      avisoAjustes,
      el("button", { class: "btn", type: "button", onclick: async (ev) => {
        const boton = ev.currentTarget;
        boton.disabled = true;
        const cambios = {
          ligas: [...elegidas],
          modelo: campos.modelo.value.trim(),
          ollama: campos.ollama.value.trim(),
          ollama_api_key: campos.nube.value,
          guardia: { activa: campos.activa.checked, hora: campos.hora.value,
            dias: Number(campos.dias.value), partidos: Number(campos.partidos.value),
            max: Number(campos.max.value) },
          web: { puerto: Number(campos.puerto.value), lan: campos.lan.checked,
            clave: campos.clave.value },
          red: { ca_bundle: campos.ca.value.trim(),
            sin_verificar: campos.sinVerificar.checked },
          telegram: { token: campos.token.value,
            chats: campos.chats.value.split(",").map((x) => x.trim()).filter(Boolean)
              .map(Number) },
        };
        const r = await api.post("/api/ajustes", cambios);
        boton.disabled = false;
        if (fallo(r)) { poner(avisoAjustes, fallo(r)); return; }
        if (!r.guardado) {
          poner(avisoAjustes, ...r.problemas.map((x) => msg(x, "mal")));
          return;
        }
        poner(avisoAjustes, msg("Guardado."),
          (r.hace_falta_reiniciar || []).length
            ? msg("Para que valga " + r.hace_falta_reiniciar.join(", ")
                + ", reinicia cancha. Lo demás —la hora, las ligas, el modelo y el "
                + "bot— se coge al vuelo.", "ojo")
            : null);
        // El bot tarda como mucho una espera larga en enterarse; se vuelve a
        // mirar un poco después para que se vea aquí que ya escucha.
        setTimeout(() => mirarBot(null), 2000);
      } }, "Guardar ajustes"),
      (d.problemas || []).length
        ? el("div", { class: "bloque" }, ...d.problemas.map((x) => msg(x, "ojo"))) : null,
      nota(`Se guardan en el ordenador, así que cambiarlo desde aquí lo cambia para `
        + `todo: la guardia, el bot y el terminal.`));
    pinta();
    pintaBot(d);
  });
  cuerpo.append(espera("Leyendo los ajustes…"));
  return tarjeta("Ajustes", cuerpo);
}

function ajustes(e) {
  const clave = el("input", { class: "campo", id: "clave", type: "password", value: api.clave,
    placeholder: "Clave del servidor (si arrancó con --clave)" });
  return tarjeta("Ajustes",
    el("form", { class: "busca", onsubmit: (ev) => { ev.preventDefault(); api.clave = clave.value;
      guardar("clave", clave.value); ir("#/memoria", true); } },
      clave, el("button", { class: "btn plano", type: "submit" }, "Guardar")),
    el("div", { class: "fila" }, el("span", { class: "mini" }, "tema"),
      ...[["auto", "Automático"], ["light", "Claro"], ["dark", "Oscuro"]].map((par) =>
        el("button", { class: "btn plano s", onclick: () => tema(par[0]) }, par[1]))),
    el("p", { class: "peq gris" }, `cancha ${e.version || ""} · `
      + String(e.hora || "").replace("T", " ").slice(0, 16)));
}

function tema(v) {
  guardar("tema", v);
  if (v === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", v);
}

/* ═══════════════════════════════════════════════════════════ rutas ═══ */
const NAV = [
  ["hoy", "Hoy", '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'],
  ["seguro", "Seguro", '<path d="M12 3l7 3v6c0 4-3 7.5-7 9-4-1.5-7-5-7-9V6z"/><path d="M9 12l2 2 4-4"/>'],
  ["analista", "Analista", '<path d="M21 12a8.5 8.5 0 1 1-3.4-6.8"/><path d="M8 11h.01M12 11h.01M16 11h.01"/><path d="M7 19.5L5 22v-4"/>'],
  ["buscar", "Buscar", '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/>'],
  ["agentes", "Agentes", '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M15.5 20c0-2.2 1.4-3.8 3.5-3.8s2.5 1.2 2.5 2.6"/>'],
  ["memoria", "Memoria", '<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>'],
];
function nav(activa) {
  $("#nav").replaceChildren(...NAV.map((fila) =>
    el("a", { href: "#/" + fila[0], class: fila[0] === activa ? "on" : "" },
      el("span", { html: svg(fila[2]) }), fila[1], el("span", { class: "punto" }))));
}
function ir(hash, forzar) { if (location.hash === hash && forzar) pintar(); else location.hash = hash; }

let actual = "";
async function pintar() {
  const partes = location.hash.replace(/^#\/?/, "").split("/");
  const nombre = V[partes[0]] ? partes[0] : "hoy";
  nav(nombre);
  actual = location.hash;
  const raiz = $("#vista");
  try { await V[nombre](raiz, partes.slice(1)); }
  catch (err) { raiz.append(msg("Algo ha fallado en la página: " + err.message, "mal")); }
  if (location.hash === actual) window.scrollTo({ top: 0 });
}
async function pulso() {
  const e = await api.get("/api/estado");
  const nodo = $("#pulso");
  if (!e || e.error) {
    nodo.replaceChildren(el("span", { class: "led mal" }),
      el("span", {}, e && e.sin_clave ? "hace falta la clave" : "sin servidor"));
    return;
  }
  const m = e.memoria || {};
  nodo.replaceChildren(el("span", { class: "led " + (m.partidos ? "" : "off") }),
    el("span", {}, m.partidos ? `${m.partidos} partidos` : "memoria vacía"));
}

tema(leer("tema", "auto"));
window.addEventListener("hashchange", pintar);
pintar(); pulso();
if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
  navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
