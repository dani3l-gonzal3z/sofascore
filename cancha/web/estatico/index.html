<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cancha</title>
<meta name="description" content="Los partidos del día, lo que casi siempre pasa, y un analista local que busca los datos por ti.">
<meta name="theme-color" content="#0A6B4A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0E0D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="cancha">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icono-180.png">
<link rel="icon" href="/icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* ═══ programa de partido ═══ papel de periódico y césped de noche ═══ */
:root {
  --papel:    #F4F3EE;
  --cal:      #FFFFFF;
  --cal-2:    #EAE9E2;
  --tinta:    #16191A;
  --gris:     #62696A;
  --linea:    #DEDDD4;
  --linea-2:  #C9C8BD;
  --cesped:   #0A6B4A;
  --cesped-t: #E0EFE7;
  --bandera:  #C2410C;
  --bandera-t:#FBEAE1;
  --ambar:    #A16207;
  --ambar-t:  #F7EFDC;
  --azul:     #1D4E89;
  --azul-t:   #E3EAF3;
  --visita:   #8A4B10;

  --r:  10px;
  --r-s: 6px;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --texto: "Public Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sombra: 0 1px 2px rgba(22, 25, 26, .05), 0 6px 20px -12px rgba(22, 25, 26, .18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #0B0E0D; --cal: #141918; --cal-2: #1C2322; --tinta: #E9EDEA;
    --gris: #8D9793; --linea: #242C2A; --linea-2: #333D3A;
    --cesped: #3FBF89; --cesped-t: #12261E;
    --bandera: #F97C4A; --bandera-t: #2E1810;
    --ambar: #D9A441; --ambar-t: #2A2112;
    --azul: #7FA8DC; --azul-t: #152232; --visita: #D89C5A;
    --sombra: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #0B0E0D; --cal: #141918; --cal-2: #1C2322; --tinta: #E9EDEA;
  --gris: #8D9793; --linea: #242C2A; --linea-2: #333D3A;
  --cesped: #3FBF89; --cesped-t: #12261E;
  --bandera: #F97C4A; --bandera-t: #2E1810;
  --ambar: #D9A441; --ambar-t: #2A2112;
  --azul: #7FA8DC; --azul-t: #152232; --visita: #D89C5A;
  --sombra: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--papel); color: var(--tinta);
  font: 400 15.5px/1.5 var(--texto);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  font-variant-numeric: tabular-nums;
}
a { color: inherit; text-decoration-color: var(--linea-2); text-underline-offset: 2px; }
a:hover { text-decoration-color: currentColor; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cesped); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3, .cifra { font-family: var(--display); }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h2 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
h3 { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
     color: var(--gris); margin: 0; }
p { margin: 0; }
code { font: 12.5px var(--mono); background: var(--cal-2); padding: 1px 5px; border-radius: 4px; }
.gris { color: var(--gris); }
.peq { font-size: 13px; }
.mini { font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--gris);
        font-weight: 600; }

/* ── armazón ───────────────────────────────────────────────────────── */
.app { display: grid; grid-template-rows: auto 1fr auto; min-height: 100%; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--papel); border-bottom: 1px solid var(--linea);
  padding: 10px 16px; display: flex; align-items: center; gap: 10px;
}
.marca { font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -.03em; }
.marca::before {
  content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 7px;
  border: 2px solid var(--cesped); border-radius: 50%; vertical-align: 1px;
}
.pulso { margin-left: auto; display: flex; align-items: center; gap: 7px; }
.led { width: 7px; height: 7px; border-radius: 50%; background: var(--cesped); flex: none; }
.led.off { background: var(--ambar); }
.led.mal { background: var(--bandera); }
main { width: 100%; max-width: 940px; margin: 0 auto; padding: 18px 16px 28px;
       display: grid; gap: 18px; align-content: start; min-width: 0; }
main > * { min-width: 0; max-width: 100%; }

nav.barra {
  position: sticky; bottom: 0; z-index: 20;
  background: var(--papel); border-top: 1px solid var(--linea);
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px;
  padding: 5px 6px calc(5px + env(safe-area-inset-bottom, 0px));
}
nav.barra a {
  text-decoration: none; color: var(--gris); display: grid; justify-items: center; gap: 3px;
  padding: 6px 2px 4px; border-radius: 8px; font-size: 10.5px; font-weight: 600;
  letter-spacing: .02em;
}
nav.barra svg { width: 21px; height: 21px; stroke: currentColor; fill: none;
                stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
nav.barra a.on { color: var(--tinta); }
nav.barra a.on svg { stroke: var(--cesped); }
nav.barra a .punto { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
nav.barra a.on .punto { background: var(--cesped); }

@media (min-width: 860px) {
  .app { grid-template-columns: 208px 1fr; grid-template-rows: auto 1fr; }
  header.top { grid-column: 1 / -1; padding: 12px 22px; }
  nav.barra {
    grid-row: 2; grid-column: 1; position: sticky; align-self: start; bottom: auto;
    top: calc(53px + env(safe-area-inset-top, 0px));
    display: flex; flex-direction: column; gap: 1px; background: none;
    border: none; border-right: 1px solid var(--linea); padding: 18px 12px; min-height: 70vh;
  }
  nav.barra a { display: flex; flex-direction: row; align-items: center; gap: 11px;
                padding: 9px 11px; font-size: 14.5px; letter-spacing: 0; }
  nav.barra a.on { background: var(--cal); box-shadow: var(--sombra); }
  nav.barra a .punto { display: none; }
  main { grid-column: 2; padding: 26px 30px 60px; max-width: 900px; margin: 0; }
}

/* ── piezas ────────────────────────────────────────────────────────── */
.bloque { display: grid; gap: 11px; min-width: 0; }
.tarjeta { background: var(--cal); border: 1px solid var(--linea); border-radius: var(--r);
           padding: 14px 15px; display: grid; gap: 11px; min-width: 0; }
/* `minmax(0, 1fr)` en vez de la columna automática: sin esto una tabla ancha
   estira la rejilla entera y la página se desplaza a lo ancho en el móvil,
   que es justo lo que no puede pasar. */
main, .tarjeta, .bloque, .detalle, .dia, details {
  grid-template-columns: minmax(0, 1fr);
}
.tarjeta > *, .bloque > *, .detalle > * { min-width: 0; max-width: 100%; }
details { min-width: 0; max-width: 100%; display: grid; gap: 8px; }
details > * { min-width: 0; max-width: 100%; }
details > summary { overflow-wrap: anywhere; }
.titular { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.titular .resto { margin-left: auto; }
hr.hr { height: 1px; background: var(--linea); border: 0; margin: 2px 0; }
.fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }

.btn {
  border: 1px solid var(--cesped); background: var(--cesped); color: var(--papel);
  padding: 9px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;
  white-space: nowrap; transition: filter .12s ease;
}
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: progress; }
.btn.plano { background: transparent; color: var(--tinta); border-color: var(--linea-2); }
.btn.plano:hover { background: var(--cal-2); filter: none; }
.btn.s { padding: 5px 10px; font-size: 13px; border-radius: 7px; }
a.btn { text-decoration: none; display: inline-block; }

input.campo, select.campo, textarea.campo {
  background: var(--cal); border: 1px solid var(--linea-2); border-radius: 8px;
  padding: 9px 12px; min-width: 0; flex: 1 1 180px; max-width: 100%;
}
input.campo::placeholder, textarea.campo::placeholder { color: var(--gris); }
form.busca { display: flex; gap: 8px; flex-wrap: wrap; }

.seg { display: inline-flex; background: var(--cal-2); border-radius: 9px; padding: 3px;
       gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 7px;
              font-size: 13.5px; font-weight: 600; color: var(--gris); cursor: pointer; }
.seg button.on { background: var(--cal); color: var(--tinta); box-shadow: var(--sombra); }

.eti { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700;
       letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px;
       background: var(--cal-2); color: var(--gris); white-space: nowrap; text-decoration: none; }
.eti.verde  { background: var(--cesped-t); color: var(--cesped); }
.eti.roja   { background: var(--bandera-t); color: var(--bandera); }
.eti.ambar  { background: var(--ambar-t); color: var(--ambar); }
.eti.azul   { background: var(--azul-t); color: var(--azul); }
.eti.hueca  { background: none; border: 1px dashed var(--linea-2); }

.nota { font-size: 13px; color: var(--gris); font-style: italic; line-height: 1.5; }
.msg { border-left: 2px solid var(--azul); background: var(--azul-t); color: var(--tinta);
       padding: 9px 12px; border-radius: 0 var(--r-s) var(--r-s) 0; font-size: 13.5px; }
.msg.mal { border-color: var(--bandera); background: var(--bandera-t); }
.msg.ojo { border-color: var(--ambar); background: var(--ambar-t); }
.espera { color: var(--gris); font-size: 13.5px; display: flex; align-items: center; gap: 9px;
          padding: 14px 0; }
.espera::before { content: ""; width: 14px; height: 14px; border: 2px solid var(--linea-2);
                  border-top-color: var(--cesped); border-radius: 50%;
                  animation: giro .8s linear infinite; flex: none; }
@keyframes giro { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ── tarjeta de partido: plegada por defecto ───────────────────────── */
.dia { display: grid; gap: 7px; min-width: 0; }
.liga-tit { display: flex; align-items: baseline; gap: 9px; padding: 10px 2px 2px; }
.liga-tit .n { font-size: 11.5px; color: var(--gris); font-weight: 600; }

.pdo { background: var(--cal); border: 1px solid var(--linea); border-radius: var(--r);
       overflow: hidden; transition: border-color .14s ease, box-shadow .14s ease; min-width: 0; }
.pdo:hover { border-color: var(--linea-2); }
.pdo.abierto { border-color: var(--linea-2); box-shadow: var(--sombra); }
.pdo > .cabeza { width: 100%; border: 0; background: none; text-align: left; cursor: pointer;
                 padding: 11px 13px; display: grid; gap: 7px; }
.pdo .arriba { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.pdo .hora { font-family: var(--display); font-weight: 600; font-size: 13.5px; color: var(--gris);
             flex: none; width: 42px; }
.pdo .equipos { font-weight: 600; font-size: 15.5px; letter-spacing: -.01em; flex: 1 1 auto;
                min-width: 0; overflow-wrap: anywhere; }
.pdo .equipos .sep { color: var(--gris); font-weight: 400; margin: 0 5px; }
.pdo .abajo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-left: 52px; }
@media (max-width: 470px) { .pdo .abajo { padding-left: 0; } }

.chevron { flex: none; width: 15px; height: 15px; stroke: var(--gris); fill: none;
           stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
           transition: transform .16s ease; }
.pdo.abierto .chevron { transform: rotate(180deg); }
.detalle { border-top: 1px solid var(--linea); padding: 14px 15px 16px; display: grid; gap: 14px;
           min-width: 0; }

.prob { display: flex; height: 5px; width: 104px; border-radius: 3px; overflow: hidden;
        background: var(--cal-2); flex: none; }
.prob i { display: block; height: 100%; }
.prob .l { background: var(--cesped); }
.prob .e { background: var(--linea-2); }
.prob .v { background: var(--visita); }

.forma { display: inline-flex; gap: 2.5px; }
.forma i { width: 7px; height: 7px; border-radius: 2px; background: var(--linea-2); display: block; }
.forma i.g { background: var(--cesped); }
.forma i.p { background: var(--bandera); }

/* ── comparativas ──────────────────────────────────────────────────── */
.vs { display: grid; gap: 7px; }
.vs .m { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 9px;
         font-size: 13.5px; }
.vs .m .et { grid-column: 1 / -1; font-size: 10.5px; letter-spacing: .07em;
             text-transform: uppercase; color: var(--gris); font-weight: 600; margin-bottom: -4px; }
.vs .pista { display: flex; height: 6px; border-radius: 3px; overflow: hidden;
             background: var(--cal-2); }
.vs .pista i { display: block; height: 100%; }
.vs .pista .l { background: var(--cesped); }
.vs .pista .v { background: var(--visita); }
.vs .izq { text-align: right; font-weight: 600; }
.vs .der { font-weight: 600; }

.rasgos { display: grid; gap: 5px; }
.rasgo { display: grid; grid-template-columns: 1fr 92px 46px; gap: 9px; align-items: center;
         font-size: 13.5px; }
.rasgo .eje { position: relative; height: 6px; background: var(--cal-2); border-radius: 3px; }
.rasgo .eje::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px;
                     width: 1px; background: var(--linea-2); }
.rasgo .eje i { position: absolute; top: 0; height: 100%; border-radius: 3px;
                background: var(--cesped); }
.rasgo .eje i.neg { background: var(--visita); }
.rasgo .v { text-align: right; font-weight: 700; font-family: var(--display); }

.cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(102px, 1fr)); gap: 8px; }
.caja { background: var(--cal-2); border-radius: var(--r-s); padding: 9px 11px; min-width: 0; }
.caja .cifra { font-size: 21px; font-weight: 700; line-height: 1.1; display: block;
               letter-spacing: -.01em; }
.caja .et { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--gris);
            font-weight: 600; display: block; margin-top: 2px; }
.tres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; text-align: center; }

.lista { list-style: none; margin: 0; padding: 0; display: grid; }
.lista li { padding: 9px 0; border-top: 1px solid var(--linea); display: flex; gap: 9px;
            align-items: baseline; flex-wrap: wrap; font-size: 14px; min-width: 0; }
.lista li:first-child { border-top: 0; padding-top: 2px; }
.lista li.pulsable { cursor: pointer; }
.lista li.pulsable:hover { background: var(--cal-2); }

/* Una tabla ancha se desliza dentro de su caja; para que `overflow` funcione
   de verdad dentro de un grid, la caja necesita poder encogerse (`min-width`). */
.desliza { overflow-x: auto; margin: 0 -2px; min-width: 0; max-width: 100%; }
table.tb { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.tb th, table.tb td { padding: 6px 8px; text-align: left; border-top: 1px solid var(--linea);
                           white-space: nowrap; }
table.tb th { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
              color: var(--gris); font-weight: 600; border-top: 0; }
table.tb td.n, table.tb th.n { text-align: right; }
table.tb td:first-child, table.tb th:first-child { white-space: normal; min-width: 130px; }

.grafico svg { width: 100%; height: auto; display: block; }
.leyenda { display: flex; gap: 14px; font-size: 12.5px; flex-wrap: wrap; color: var(--gris); }
.leyenda i { display: inline-block; width: 11px; height: 3px; border-radius: 2px;
             vertical-align: middle; margin-right: 5px; }

/* ── casi seguro ───────────────────────────────────────────────────── */
.av { display: grid; gap: 8px; border-left: 3px solid var(--linea-2); padding-left: 12px; }
.av.alto { border-color: var(--bandera); }
.av.medio { border-color: var(--ambar); }
.av .cab { display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap; }
.av .pc { font-family: var(--display); font-size: 25px; font-weight: 800; line-height: 1;
          letter-spacing: -.02em; flex: none; }
.barra-conf { position: relative; height: 5px; background: var(--cal-2); border-radius: 3px; }
.barra-conf i { position: absolute; left: 0; top: 0; height: 100%; border-radius: 3px;
                background: var(--cesped); }
.barra-conf b { position: absolute; top: -3px; width: 2px; height: 11px; background: var(--tinta);
                border-radius: 1px; }

/* ── analista ──────────────────────────────────────────────────────── */
.chat { display: grid; gap: 14px; }
.burbuja { display: grid; gap: 7px; min-width: 0; }
.burbuja.yo { justify-items: end; }
.burbuja.yo .txt { background: var(--cesped); color: var(--papel);
                   border-radius: 12px 12px 3px 12px; padding: 9px 13px; max-width: 86%;
                   overflow-wrap: anywhere; }
.burbuja.el .txt { background: var(--cal); border: 1px solid var(--linea);
                   border-radius: 12px 12px 12px 3px; padding: 11px 14px; white-space: pre-wrap;
                   overflow-wrap: anywhere; }
.pasos { display: flex; flex-wrap: wrap; gap: 5px; }
.paso { font: 11.5px var(--mono); background: var(--cal-2); color: var(--gris);
        padding: 2px 8px; border-radius: 999px; max-width: 100%; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
.paso.vivo { background: var(--cesped-t); color: var(--cesped); }
.redactar { display: flex; gap: 8px; align-items: flex-end; position: sticky; bottom: 0;
            background: var(--papel); padding: 8px 0 2px; }
.redactar textarea { resize: none; max-height: 140px; min-height: 42px; line-height: 1.4; }
.sugeridas { display: flex; gap: 6px; flex-wrap: wrap; }
.sug { border: 1px solid var(--linea-2); background: var(--cal); border-radius: 999px;
       padding: 5px 11px; font-size: 13px; cursor: pointer; text-align: left; }
.sug:hover { background: var(--cal-2); }

.registro { font: 12.5px/1.45 var(--mono); background: var(--cal-2); border-radius: var(--r-s);
            padding: 10px 12px; max-height: 240px; overflow: auto; white-space: pre-wrap; }
details > summary { cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--cesped);
                    list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸ "; }
details[open] > summary::before { content: "▾ "; }
.vacio { text-align: center; padding: 32px 16px; color: var(--gris); display: grid; gap: 10px;
         justify-items: center; }
.vacio svg { width: 34px; height: 34px; stroke: var(--linea-2); fill: none; stroke-width: 1.5;
             stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="marca">cancha</span>
    <span class="pulso peq gris" id="pulso"><span class="led off"></span><span>…</span></span>
  </header>
  <main id="vista" aria-live="polite"></main>
  <nav class="barra" id="nav"></nav>
</div>

<script>
/* ═══════════════════════════════════════════════════════ utilidades ═══ */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs, ...hijos) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const h of hijos.flat(3)) {
    if (h === null || h === undefined || h === false) continue;
    n.append(h.nodeType ? h : document.createTextNode(String(h)));
  }
  return n;
}

function comparar(filas, local, visitante) {

  for (const f of filas) {
    const a = Number(String(f.local === null || f.local === undefined ? "" : f.local).replace("%", "")) || 0;
    const b = Number(String(f.visitante === null || f.visitante === undefined ? "" : f.visitante).replace("%", "")) || 0;

function rasgos(dimensiones, limite = 6) {

  if (!filas.length) return nota("Sin media de liga con la que comparar todavía.");
  const c = el("div", { class: "rasgos" });
  for (const [nombre, d] of filas) {

    c.append(el("div", { class: "rasgo" },

const cifras = (pares) => el("div", { class: "cifras" }, ...pares.filter(Boolean).map(([v, et]) =>
  el("div", { class: "caja" }, el("span", { class: "cifra" }, v === null || v === undefined ? "—" : v),

function tabla(cols, filas, leerCelda) {

function carrera(c) {
  if (!c || !c.disponible || !(c.serie || []).length) return null;
  const nombres = Object.keys(c.total || {});
  const W = 640, H = 190, m = { l: 32, r: 14, t: 12, b: 24 };
  const maxX = Math.max(90, ...c.serie.map((p) => p.minuto || 0));
  const maxY = Math.max(0.6, ...nombres.map((k) => c.total[k])) * 1.15;
  const x = (v) => m.l + (v / maxX) * (W - m.l - m.r);
  const y = (v) => H - m.b - (v / maxY) * (H - m.t - m.b);
  const col = ["var(--cesped)", "var(--visita)"];
  const paso = maxY > 2.4 ? 1 : 0.5;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="xG acumulado minuto a minuto">`;
  for (let v = 0; v <= maxY; v += paso)
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--linea)" stroke-width="1"/>`
       + `<text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--gris)">${v.toFixed(1)}</text>`;
  for (const min of [0, 15, 30, 45, 60, 75, 90])
    s += `<text x="${x(min)}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="var(--gris)">${min}'</text>`;
  nombres.forEach((k, i) => {
    const pts = [[0, 0], ...c.serie.map((p) => [p.minuto || 0, p[k] || 0])];
    s += `<path d="${pts.map(([a, b], j) => `${j ? "L" : "M"}${x(a).toFixed(1)},${y(b).toFixed(1)}`).join(" ")}"`
       + ` fill="none" stroke="${col[i]}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    const u = pts[pts.length - 1];
    s += `<circle cx="${x(u[0])}" cy="${y(u[1])}" r="3.5" fill="${col[i]}"/>`;
  });
  s += "</svg>";
  return el("div", { class: "bloque grafico" }, el("div", { html: s }),
    el("div", { class: "leyenda" }, ...nombres.map((k, i) =>
      el("span", {}, el("i", { style: `background:${col[i]}` }), `${k} ${n2(c.total[k])}`))),
    c.manda_en_xg ? nota(`Manda en xG ${c.manda_en_xg}${c.desde_el_minuto ? ` desde el minuto ${c.desde_el_minuto}` : ""}.`) : null);
}

const GRUPOS_UI = [["", "Todas"], ["grandes", "Cinco grandes"], ["grandes_f", "Cinco grandes (f)"],

const V = {};

/* ── HOY ─────────────────────────────────────────────────────────── */
V.hoy = async (raiz, [fecha]) => {
  fecha = fecha || leer("fecha", hoy());
  const grupos = leer("grupos", "");
  raiz.replaceChildren(el("div", { class: "titular" },
    el("h1", {}, fecha === hoy() ? "Hoy" : fecha),
    el("div", { class: "resto fila" },
      el("input", { class: "campo", type: "date", id: "fecha", value: fecha, style: "flex:0 1 148px",
        onchange: (e) => { guardar("fecha", e.target.value); ir(`#/hoy/${e.target.value}`, true); } }),
      el("select", { class: "campo", id: "grupos", style: "flex:0 1 172px",
        onchange: (e) => { guardar("grupos", e.target.value); ir(`#/hoy/${fecha}`, true); } },
        ...GRUPOS_UI.map(([v, t]) => el("option", { value: v, selected: v === grupos }, t))))),
    espera("Buscando lo que se juega…"));

  let brief = await api.get("/api/briefing/" + fecha);
  if (brief && (brief.error || brief.sin_clave)) brief = null;
  const agenda = brief ? null : await api.h("agenda_del_dia", { fecha, grupos: grupos || undefined });
  raiz.lastChild.remove();
  if (!brief && fallo(agenda)) { raiz.append(fallo(agenda)); return; }

  let partidos = [];
  if (brief) {
    partidos = brief.partidos.map((p) => ({ id: p.partido.id, liga: p.partido.competicion,
      hora: p.partido.hora_utc, local: p.partido.local, visitante: p.partido.visitante, datos: p }));
  } else {
    for (const [liga, lista] of Object.entries(agenda.por_competicion || {}))
      for (const p of lista) {
        const trozos = String(p.partido).split(" - ");
        partidos.push({ id: p.id, liga, hora: p.hora_utc, local: trozos[0],
          visitante: trozos.slice(1).join(" - ") });
      }
  }

  const digest = el("div", {});
  raiz.append(digest);

  if (!partidos.length) {
    raiz.append(vacio('<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/>',
      "No se juega nada",
      el("p", { class: "gris peq" }, "Ese día no hay partidos en las competiciones elegidas."),
      el("a", { class: "btn plano s", href: "#/memoria" }, "Ver el catálogo de ligas")));
    return;
  }

  raiz.append(brief
    ? msg(`Briefing de las ${String(brief.generado || "").slice(11, 16)} UTC · `
        + `${(brief.memoria || {}).partidos || 0} partidos en memoria.`)
    : el("div", { class: "fila" },
        msg("Agenda en directo, sin analizar. Genera el briefing para tener cada partido estudiado.", "ojo"),
        el("button", { class: "btn s", onclick: (e) => generarBriefing(fecha, raiz, e.currentTarget) },
          "Generar briefing")));

  const porLiga = {};
  for (const p of partidos) (porLiga[p.liga || "Otras"] ||= []).push(p);
  for (const [liga, lista] of Object.entries(porLiga).sort((a, b) => a[0].localeCompare(b[0]))) {
    const grupo = el("div", { class: "dia" }, el("div", { class: "liga-tit" },
      el("h3", {}, liga), el("span", { class: "n" }, `${lista.length} partido${lista.length > 1 ? "s" : ""}`)));
    for (const p of lista) grupo.append(tarjetaPartido(p));
    raiz.append(grupo);
  }

  /* El digest de casi seguro llega cuando llega: no bloquea la lista. */
  api.post("/api/seguro", { fecha, grupos: grupos || undefined, umbral: 0.7 }).then((s) => {
    if (!s || s.error || !(s.avisos || []).length) return;
    const porPartido = {};
    for (const a of s.avisos) (porPartido[a.partido_id] ||= []).push(a);
    for (const p of partidos) {
      const suyos = porPartido[p.id] || [];
      p.avisos = suyos;
      const nodo = $(`#p${p.id} .insignias`);
      if (nodo && suyos.length) nodo.prepend(etiqueta(`${suyos.length} casi seguro`, "roja"));
    }
    digest.replaceChildren(tarjeta(null,
      el("div", { class: "titular" }, el("h3", {}, "Casi seguro hoy"),
        el("a", { class: "resto peq", href: `#/seguro/hoy/${fecha}` }, "ver todo →")),
      el("ul", { class: "lista" }, ...s.avisos.slice(0, 4).map((a) => el("li", {},
        el("span", { style: "font-family:var(--display);font-weight:800;font-size:17px;flex:none" }, pc(a.suelo)),
        el("span", { style: "flex:1 1 200px;min-width:0" }, el("b", {}, a.sujeto), " — ", a.dice),
        el("span", { class: "gris peq" }, `${a.casos} casos`))))));
  });
};

async function generarBriefing(fecha, raiz, boton) {
  boton.disabled = true; boton.textContent = "Generando…";
  const grupos = leer("grupos", "");
  const d = await api.h("briefing_del_dia", { fecha, grupos: grupos || undefined, recalcular: true });
  if (fallo(d)) { raiz.append(fallo(d)); boton.disabled = false; boton.textContent = "Generar briefing"; }
  else ir(`#/hoy/${fecha}`, true);
}

function tarjetaPartido(p) {
  const d = p.datos;
  const mercado = d && d.mercado && d.mercado.disponible ? d.mercado : null;
  const cuerpo = el("div", { class: "detalle", hidden: true });
  const insignias = el("span", { class: "insignias fila", style: "gap:5px" });
  if (d && (d.duelos || []).length) insignias.append(etiqueta(`${d.duelos.length} duelos`, "azul"));
  if (mercado && mercado.favorito && mercado.favorito.lado)
    insignias.append(etiqueta(`${mercado.favorito.lado} ${mercado.favorito.claridad}`));

  const equipos = (d && d.equipos) || {};
  const formaL = equipos.local && equipos.local.resultados ? equipos.local.resultados.racha : null;
  const formaV = equipos.visitante && equipos.visitante.resultados ? equipos.visitante.resultados.racha : null;

  const cabeza = el("button", { class: "cabeza", type: "button", "aria-expanded": "false",
    onclick: (e) => alternar(e.currentTarget, p, cuerpo) },
    el("div", { class: "arriba" },
      el("span", { class: "hora" }, p.hora || "—"),
      el("span", { class: "equipos" }, p.local, el("span", { class: "sep" }, "–"), p.visitante),
      el("span", { html: svg('<path d="M6 9l6 6 6-6"/>', "chevron") })),
    el("div", { class: "abajo peq gris" },
      barraProb(mercado ? mercado.probabilidades : null),
      formaL ? el("span", { class: "fila", style: "gap:5px" }, forma(formaL),
        el("span", { class: "gris" }, "/"), forma(formaV)) : null,
      insignias));
  return el("article", { class: "pdo", id: "p" + p.id }, cabeza, cuerpo);
}

async function alternar(cabeza, p, cuerpo) {
  const caja = cabeza.parentElement;
  const abierto = !cuerpo.hidden;
  cuerpo.hidden = abierto;
  caja.classList.toggle("abierto", !abierto);
  cabeza.setAttribute("aria-expanded", String(!abierto));
  if (abierto || cuerpo.dataset.cargado) return;
  cuerpo.dataset.cargado = "1";
  cuerpo.replaceChildren(espera("Montando la previa…"));
  const pv = await api.h("previa_de_partido", { partido: String(p.id) });
  cuerpo.replaceChildren(...previaDentro(pv, p).filter(Boolean));
}

function previaDentro(pv, p) {
  const err = fallo(pv);
  if (err) return [err];
  const partes = [];
  const mercado = pv.mercado && pv.mercado.disponible ? pv.mercado : null;
  if (mercado) {
    const pr = mercado.probabilidades || {};
    const lectura = mercado.favorito && mercado.favorito.lectura;
    partes.push(el("div", { class: "bloque" }, el("h3", {}, "Lo que dice el mercado"),
      el("div", { class: "tres" },
        el("div", { class: "caja" }, el("span", { class: "cifra" }, pc(pr.local)), el("span", { class: "et" }, "local")),
        el("div", { class: "caja" }, el("span", { class: "cifra" }, pc(pr.empate)), el("span", { class: "et" }, "empate")),
        el("div", { class: "caja" }, el("span", { class: "cifra" }, pc(pr.visitante)), el("span", { class: "et" }, "visitante"))),
      nota(lectura ? lectura[0].toUpperCase() + lectura.slice(1) + "." : null)));
  } else if (pv.mercado && pv.mercado.nota) partes.push(nota(pv.mercado.nota));

  for (const lado of ["local", "visitante"]) {
    const e = (pv.equipos || {})[lado];
    const nombre = (pv.partido || {})[lado] || (lado === "local" ? p.local : p.visitante);
    if (!e) continue;
    if (!e.disponible) {
      partes.push(el("div", { class: "bloque" }, el("h3", {}, nombre), msg(e.nota, "ojo")));
      continue;
    }
    const r = e.resultados;
    const jugadores = ((pv.jugadores || {})[lado] || []).filter((j) => (j.rachas || []).length);
    partes.push(el("div", { class: "bloque" },
      el("div", { class: "titular" }, el("h3", {}, nombre),
        el("span", { class: "resto fila peq gris", style: "gap:7px" }, forma(r.racha),
          `${r.goles_favor}-${r.goles_contra} en ${e.partidos_mirados}`,
          el("a", { href: `#/buscar/equipo/${encodeURIComponent(nombre)}` }, "ver →"))),
      rasgos(e.dimensiones, 4),
      jugadores.length ? el("ul", { class: "lista" }, ...jugadores.slice(0, 3).map((j) =>
        el("li", {}, el("a", { href: `#/buscar/jugador/${encodeURIComponent(j.jugador)}` }, j.jugador),
          el("span", { class: "gris peq" }, j.rachas.join(" · "))))) : null));
  }

  if ((pv.donde_se_hacen_dano || []).length)
    partes.push(el("div", { class: "bloque" }, el("h3", {}, "Dónde se pueden hacer daño"),
      el("ul", { class: "lista" }, ...pv.donde_se_hacen_dano.slice(0, 4).map((c) => el("li", {}, c.aviso)))));

  const duelos = (p.datos && p.datos.duelos) || [];
  if (duelos.length)
    partes.push(el("div", { class: "bloque" }, el("h3", {}, "Jugador contra sistema"),
      el("ul", { class: "lista" }, ...duelos.slice(0, 5).map((d) => el("li", {},
        veredicto(d.veredicto),
        el("span", { style: "flex:1 1 200px;min-width:0" },
          el("a", { href: `#/buscar/duelo/${encodeURIComponent(d.jugador)}/${encodeURIComponent(d.rival)}` }, d.jugador),
          ` contra ${d.el_rival_es}: ${d.metrica.replace(/_/g, " ")} `,
          el("b", {}, d.por_90), `/90 frente a ${d.su_media}`),
        el("span", { class: "gris peq" }, `${d.partidos} partidos`))))));

  const a = pv.arbitro || {};
  partes.push(el("div", { class: "bloque" }, el("h3", {}, "Árbitro"),
    a.disponible
      ? el("div", { class: "bloque" },
          el("div", { class: "fila" }, el("b", {}, a.arbitro),
            el("span", { class: "gris peq" }, `${a.partidos_mirados} partidos vistos`)),
          cifras([[a.por_partido.amarillas, "amarillas"], [a.por_partido.rojas, "rojas"],
                  [a.por_partido.penaltis, "penaltis"], [a.por_partido.faltas, "faltas"]]),
          nota(a.aviso))
      : nota(a.nota || "Sin árbitro designado todavía.")));

  partes.push(el("div", { class: "fila" },
    el("a", { class: "btn plano s", href: `#/buscar/partido/${p.id}` }, "Abrir el partido entero"),
    (pv.memoria || {}).consejo ? el("span", { class: "gris peq" }, pv.memoria.consejo) : null));
  return partes;
}

const SUGERENCIAS = [
  "¿Qué se juega hoy y cuál es el partido más interesante?",
  "¿Cómo llega el Girona y dónde le pueden hacer daño?",
  "¿Qué dice el recuento del patrón del favorito que pinchó?",
  "¿A algún delantero se le da mal el bloque bajo de verdad, y no por contexto?",
];
V.analista = async (raiz) => {
  const hilo = el("div", { class: "chat" });
  const caja = el("textarea", { class: "campo", id: "pregunta", rows: 1,
    placeholder: "Pregunta lo que quieras…",
    onkeydown: (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); } },
    oninput: (e) => { e.target.style.height = "auto";
      e.target.style.height = Math.min(140, e.target.scrollHeight) + "px"; } });
  const boton = el("button", { class: "btn", onclick: () => enviar() }, "Preguntar");
  const sugeridas = el("div", { class: "sugeridas" }, ...SUGERENCIAS.map((s) =>
    el("button", { class: "sug", type: "button", onclick: () => { caja.value = s; enviar(); } }, s)));
  const avisoOllama = el("div", {});

  raiz.replaceChildren(el("div", { class: "titular" }, el("h1", {}, "Analista"),
    el("span", { class: "resto gris peq", id: "modelo" }, "")),
    avisoOllama, hilo, sugeridas, el("div", { class: "redactar" }, caja, boton));

  const estado = await api.get("/api/analista");
  $("#modelo").textContent = (estado && estado.modelo) || "";
  if (!estado || estado.disponible === false) {
    avisoOllama.replaceChildren(el("div", { class: "msg mal" },
      el("div", {}, (estado && (estado.nota || estado.error)) || "Ollama no contesta."),
      el("div", { class: "peq", style: "margin-top:6px" }, "Instálalo desde ",
        el("a", { href: "https://ollama.com", target: "_blank", rel: "noopener" }, "ollama.com"),
        ", arráncalo y trae un modelo que sepa llamar funciones:"),
      el("pre", { class: "registro", style: "margin-top:6px" }, "ollama pull hermes3")));
    boton.disabled = true;
  } else if (estado.instalado === false) {
    avisoOllama.replaceChildren(msg(estado.nota, "ojo"));
  }

  let historial = leer("hilo", null);
  let ocupado = false;
  if (historial) hilo.append(el("div", { class: "fila" },
    el("span", { class: "gris peq" }, "Hay una conversación anterior guardada."),
    el("button", { class: "btn plano s", onclick: () => {
      historial = null; guardar("hilo", null); hilo.replaceChildren(); sugeridas.hidden = false;
    } }, "Empezar de cero")));

  async function enviar() {
    const pregunta = caja.value.trim();
    if (!pregunta || ocupado) return;
    ocupado = true; boton.disabled = true; caja.value = ""; caja.style.height = "auto";
    sugeridas.hidden = true;
    hilo.append(el("div", { class: "burbuja yo" }, el("div", { class: "txt" }, pregunta)));
    const pasos = el("div", { class: "pasos" }, el("span", { class: "paso vivo" }, "pensando…"));
    const texto = el("div", { class: "txt" }, espera("…"));
    const burbuja = el("div", { class: "burbuja el" }, pasos, texto);
    hilo.append(burbuja);
    burbuja.scrollIntoView({ block: "end", behavior: "smooth" });

    try {
      const r = await fetch("/api/analista", { method: "POST", headers: api.cab(),
        body: JSON.stringify({ pregunta, historial }) });
      if (!r.ok || !r.body) throw new Error(`El servidor no ha aceptado la pregunta (${r.status}).`);
      const lector = r.body.getReader(), dec = new TextDecoder();
      let resto = "";
      for (;;) {
        const trozo = await lector.read();
        if (trozo.done) break;
        resto += dec.decode(trozo.value, { stream: true });
        const lineas = resto.split("\n"); resto = lineas.pop() || "";
        for (const linea of lineas) {
          if (!linea.trim()) continue;
          let ev;
          try { ev = JSON.parse(linea); } catch (e) { continue; }
          if (ev.error) { texto.replaceChildren(msg(ev.error, "mal")); pasos.replaceChildren(); }
          if (ev.paso) {
            const p = ev.paso;
            pasos.querySelectorAll(".vivo").forEach((n) => n.classList.remove("vivo"));
            if (p.tipo === "herramienta")
              pasos.append(el("span", { class: "paso vivo", title: JSON.stringify(p.argumentos || {}) }, p.nombre));
            else if (p.tipo === "resultado") {
              const ultimo = pasos.lastElementChild;
              if (ultimo) ultimo.textContent = `${p.nombre} · ${p.caracteres}c`;
            } else if (p.tipo === "aviso") pasos.append(el("span", { class: "paso" }, p.texto));
            else if (p.tipo === "respuesta") texto.replaceChildren(p.texto || "(sin respuesta)");
          }
          if (ev.fin) { historial = ev.fin.historial; guardar("hilo", historial); }
        }
      }
      if (texto.querySelector(".espera")) texto.replaceChildren(msg("No ha llegado respuesta.", "ojo"));
    } catch (e) {
      texto.replaceChildren(msg(e.message, "mal"));
    } finally {
      pasos.querySelectorAll(".vivo").forEach((n) => n.classList.remove("vivo"));
      ocupado = false; boton.disabled = false; caja.focus();
      burbuja.scrollIntoView({ block: "end", behavior: "smooth" });
    }
  }
};

V.buscar = async (raiz, partes) => {
  const modos = ["partido", "equipo", "jugador", "duelo"];

  const arg = partes[1] ? decodeURIComponent(partes[1]) : "";

  guardar("modo", modo);

  raiz.replaceChildren(el("div", { class: "titular" }, el("h1", {}, "Buscar"),
    el("span", { class: "resto" }, el("div", { class: "seg" },
      ...modos.map((v) => el("button", { class: v === modo ? "on" : "",
        onclick: () => ir(`#/buscar/${v}`) }, v[0].toUpperCase() + v.slice(1)))))));

  if (modo === "duelo") {
    const j = el("input", { class: "campo", id: "d-jug", placeholder: "Jugador", value: arg, autocomplete: "off" });
    const r = el("input", { class: "campo", id: "d-riv", placeholder: "Equipo rival", value: arg2, autocomplete: "off" });
    raiz.append(el("form", { class: "busca", onsubmit: (e) => { e.preventDefault();
      if (j.value.trim() && r.value.trim())

      j, r, el("button", { class: "btn", type: "submit" }, "Ver")));
    if (!arg || !arg2) { raiz.append(nota("Qué le ha pasado a ese jugador contra lo que ese rival suele plantear.")); return; }
    return pintarDuelo(raiz, arg, arg2);
  }

  const marcadores = { partido: "Real Madrid vs Barcelona, una URL o un id",
    equipo: "Girona, Real Madrid, un id…", jugador: "Vinicius, Lewandowski, un id…" };
  const caja = el("input", { class: "campo", type: "search", id: "q", value: arg,
    placeholder: marcadores[modo], autocomplete: "off", enterkeyhint: "search" });
  raiz.append(el("form", { class: "busca", onsubmit: (e) => { e.preventDefault();
    if (caja.value.trim()) ir(`#/buscar/${modo}/${encodeURIComponent(caja.value.trim())}`, true); } },
    caja, el("button", { class: "btn", type: "submit" }, "Buscar")));

  if (!arg) {
    raiz.append(nota({ partido: "El informe entero de un partido: estadísticas, xG, tiros y contexto.",
      equipo: "Cómo juega comparado con su liga, con qué plantea y si ha cambiado.",
      jugador: "Forma, rachas y cómo rinde según el sistema que le pongan delante." }[modo]));
    return;
  }
  if (modo === "partido") return pintarPartido(raiz, arg);
  if (modo === "equipo") return pintarEquipo(raiz, arg);
  return pintarJugador(raiz, arg);
};

        (evo.lo_que_ha_cambiado || []).length
          ? el("ul", { class: "lista" }, ...evo.lo_que_ha_cambiado.map((c) => el("li", {},
              el("b", { style: "width:50px;font-family:var(--display);flex:none" }, c.cambio),
              el("span", { style: "flex:1 1 140px" }, c.lectura),
              el("span", { class: "gris peq" }, `${c.antes} → ${c.ahora}`))))
          : nota("Juega igual que antes en todo lo que se mide aquí."),
        evo.cambio_de_dibujo ? etiqueta(`dibujo: ${evo.antes.formacion} → ${evo.ahora.formacion}`, "ambar") : null,
        nota(evo.como_leerlo))
    : nota(evo && evo.nota)));

  const not = el("div", {});
  raiz.append(tarjeta("Contexto", not, el("button", { class: "btn plano s", style: "justify-self:start",
    onclick: async (e) => {
      e.currentTarget.disabled = true; not.replaceChildren(espera("Pidiendo titulares a ESPN…"));
      const d = await api.h("noticias", { liga: est.liga || "", equipo: est.equipo, cuantas: 10 });
      if (fallo(d)) { not.replaceChildren(fallo(d)); return; }
      not.replaceChildren((d.noticias || []).length
        ? el("ul", { class: "lista" }, ...d.noticias.map((x) => el("li", {},
            el("span", { class: "gris peq", style: "width:76px;flex:none" }, String(x.fecha || "").slice(0, 10)),
            el("a", { href: x.enlace, target: "_blank", rel: "noopener", style: "flex:1 1 180px" }, x.titulo))))
        : nota("Sin titulares que mencionen al equipo."));
    } }, "Noticias (ESPN)")));
}

async function pintarJugador(raiz, nombre) {
  const eje = leer("eje", "presion");
  raiz.append(espera("Leyendo la memoria…"));
  const [fm, ct] = await Promise.all([api.h("forma_de_jugador", { jugador: nombre }),
    api.h("jugador_contra_sistema", { jugador: nombre, eje })]);
  raiz.lastChild.remove();
  if (fallo(fm)) { raiz.append(fallo(fm)); return; }
  const pp = fm.por_partido || {};
  raiz.append(tarjeta(null,
    el("div", { class: "titular" }, el("h2", {}, fm.jugador),
      el("span", { class: "resto gris peq" },
        `${fm.partidos_mirados} partidos · ${fm.titularidades} titular · ${fm.minutos_totales}′`)),
    cifras([[fm.rating_medio, "nota media"], [pp.goles, "goles"], [pp.tiros, "tiros"],
      [pp.tiros_a_puerta, "a puerta"], [pp.xg, "xG"], [pp.pases_clave, "pases clave"]]),
    (fm.rachas || []).length
      ? el("div", { class: "fila" }, ...fm.rachas.map((x) =>
          etiqueta(x.racha, /marcando|asistiendo/.test(x.racha) ? "verde" : "roja")))
      : nota("Sin rachas que destacar.")));

  const c = tarjeta(null, el("div", { class: "titular" }, el("h3", {}, "Contra sistema"),
    el("span", { class: "resto" }, el("div", { class: "seg" },
      ...[["presion", "presión"], ["linea", "línea"], ["balon", "balón"]].map((par) =>
        el("button", { class: par[0] === eje ? "on" : "", onclick: () => { guardar("eje", par[0]);
          ir(`#/buscar/jugador/${encodeURIComponent(nombre)}`, true); } }, par[1]))))));
  if (fallo(ct)) c.append(fallo(ct));
  else {
    c.append(el("p", { class: "peq gris" }, `Su media: ${ct.su_media.partidos} partidos, ${ct.su_media.minutos}′`
      + (ct.partidos_con_cuotas ? ` · ${ct.partidos_con_cuotas} con cuotas` : "")));
    const METRICAS = ["tiros", "tiros_a_puerta", "goles", "asistencias", "pases_clave", "regates", "xg"];
    for (const [et, g] of Object.entries(ct.grupos || {})) {
      const rep = g.siendo_favorito || {};
      const filas = METRICAS.map((m) => ({ m, d: g.comparado_con_su_media[m] }))
        .filter((x) => x.d && (x.d.por_90 || x.d.su_media_por_90));
      const cuantos = rep.favorito === undefined || rep.favorito === null ? "" : `, favorito en ${rep.favorito}`;
      c.append(el("details", { open: true }, el("summary", {}, `Contra ${et} `,
        el("span", { class: "gris peq", style: "font-weight:400" },
          `${g.partidos} partidos, ${g.minutos}′${cuantos}`)),
        tabla([{ t: "Métrica", k: "m" }, { t: "/90", k: "p90", n: true }, { t: "Su media", k: "med", n: true },
          { t: "Dif.", k: "dif", n: true }, { t: "p", k: "p", n: true }, { t: "", k: "v" }], filas,
          (f, col) => ({ m: f.m.replace(/_/g, " "), p90: n2(f.d.por_90), med: n2(f.d.su_media_por_90),
            dif: (f.d.diferencia > 0 ? "+" : "") + n2(f.d.diferencia),
            p: f.d.p === undefined || f.d.p === null ? "—" : n2(f.d.p, 3),
            v: veredicto(f.d.veredicto) })[col.k]),
        el("p", { class: "gris peq" }, "Contra: "
          + g.contra.map((x) => `${x.rival} (${String(x.fecha).slice(5)})`).join(", "))));
    }
    if (!Object.keys(ct.grupos || {}).length)
      c.append(nota("Ningún partido clasificable: faltan estadísticas o alineaciones de los rivales."));
    c.append(nota(ct.lo_que_no_dice));
    if (ct.partidos_con_cuotas) {
      const d = el("div", { class: "bloque" });
      c.append(d, el("button", { class: "btn plano s", style: "justify-self:start", onclick: async (e) => {
        e.currentTarget.disabled = true; d.replaceChildren(espera("Partiendo el análisis en dos…"));
        const rr = await api.h("sistema_o_contexto", { jugador: nombre, eje });
        if (fallo(rr)) { d.replaceChildren(fallo(rr)); return; }
        d.replaceChildren((rr.lectura || []).length
          ? el("ul", { class: "lista" }, ...rr.lectura.map((f) => el("li", {},
              el("b", {}, `contra ${f.contra}, ${f.metrica.replace(/_/g, " ")}: `), f.veredicto)))
          : nota("Nada se sale de su media en ninguno de los dos desgloses."), nota(rr.como_leerlo));
      } }, "¿Es el sistema o el contexto?"));
    }
  }
  raiz.append(c);
  if ((fm.partido_a_partido || []).length) raiz.append(tarjeta("Partido a partido",
    tabla([{ t: "Fecha", k: "fecha" }, { t: "Partido", k: "partido" }, { t: "′", k: "minutos", n: true },
      { t: "Nota", k: "rating", n: true }, { t: "G", k: "goles", n: true }, { t: "A", k: "asistencias", n: true },
      { t: "Tiros", k: "tiros", n: true }, { t: "xG", k: "xg", n: true }],
      fm.partido_a_partido, (f, col) => col.k === "xg" ? n2(f.xg) : f[col.k])));
}

async function pintarDuelo(raiz, jugador, rival) {
  raiz.append(espera("Midiendo al rival y buscando al jugador…"));
  const d = await api.h("duelo_jugador_rival", { jugador, rival });
  raiz.lastChild.remove();
  if (fallo(d)) { raiz.append(fallo(d)); return; }
  const rv = d.rival;
  raiz.append(tarjeta(null, el("h2", {}, `${d.jugador} contra ${rv.equipo}`),
    el("p", { class: "peq gris" }, `${rv.equipo} en sus últimos ${rv.partidos}: `
      + (Object.entries(rv.formaciones || {}).map((par) => `${par[0]} ×${par[1]}`).join(", ") || "sin alineaciones")
      + ` · ${n2(rv.posesion, 0)}% posesión · presión ${n2(rv.presion, 1)} · concede ${n2(rv.xg_concedido)} xG`)));
  for (const [eje, b] of Object.entries(d.por_eje || {})) {
    const c = tarjeta(`${eje}: ${b.el_rival_es}`);
    const s = b.resumen;
    if (!s) { c.append(nota("Este jugador no se ha medido nunca a eso, de lo que hay guardado.")); raiz.append(c); continue; }
    const fav = s.siendo_favorito || {};
    c.append(el("p", { class: "peq gris" },
      `${s.partidos} partidos · ${s.minutos}′ · nota ${s.rating === null || s.rating === undefined ? "—" : s.rating}`
      + (fav.favorito === undefined || fav.favorito === null ? "" : ` · favorito en ${fav.favorito}`)));
    c.append((s.relevante || []).length
      ? el("ul", { class: "lista" }, ...s.relevante.map((h) => el("li", {}, veredicto(h.veredicto),
          el("span", { style: "flex:1 1 180px;min-width:0" }, `${h.metrica.replace(/_/g, " ")}: `,
            el("b", {}, h.por_90), `/90 frente a ${h.su_media}`),
          el("span", { class: "gris peq" }, `p=${h.p}`))))
      : nota("Nada que no explique el azar."));
    c.append(el("p", { class: "gris peq" }, "Contra: "
      + s.contra.map((x) => `${x.rival} (${String(x.fecha).slice(5)})`).join(", ")));
    raiz.append(c);
  }
  raiz.append(nota(d.lo_que_no_dice));
}

/* ── MEMORIA ─────────────────────────────────────────────────────── */
V.memoria = async (raiz) => {
  raiz.replaceChildren(el("h1", {}, "Memoria"), espera());
  const e = await api.get("/api/estado");
  raiz.lastChild.remove();
  const err = fallo(e);
  if (err) {
    raiz.append(err);
    if (!e || !e.sin_clave) { raiz.append(ajustes({})); return; }
  }
  const m = e.memoria || {}, cat = e.catalogo || {};
  raiz.append(tarjeta(null,
    cifras([[m.partidos, "partidos"], [m.con_estadisticas, "con estadísticas"],
      [m.con_cuotas, "con cuotas"], [m.actuaciones, "actuaciones"], [m.tiros, "tiros"]]),
    el("p", { class: "peq gris" }, `${m.ruta || ""} · del ${m.desde || "—"} al ${m.hasta || "—"} · `
      + `último barrido: ${m.ultimo_barrido || "nunca"}`),
    Object.keys(m.ligas || {}).length
      ? el("div", { class: "fila" }, ...Object.entries(m.ligas).slice(0, 12).map((par) => etiqueta(`${par[0]} ${par[1]}`)))
      : null));

  const reg = el("div", { class: "registro", hidden: true });
  const fecha = el("input", { class: "campo", type: "date", id: "b-fecha", value: hoy(), style: "flex:0 1 148px" });
  const grupos = el("select", { class: "campo", id: "b-grupos", style: "flex:0 1 186px" },
    el("option", { value: "" }, "Todo el catálogo"),
    ...GRUPOS_UI.slice(1).map((par) => el("option", { value: par[0] }, par[1])));
  const max = el("input", { class: "campo", type: "number", id: "b-max", min: 0,
    placeholder: "Tope de peticiones", style: "flex:0 1 158px" });
  const btn = el("button", { class: "btn", type: "submit" }, "Barrer");
  async function vigilar() {
    const b = await api.get("/api/barrido");
    reg.hidden = false;
    reg.textContent = (b.lineas || []).join("\n") + (b.resumen ? "\n\n" + JSON.stringify(b.resumen, null, 1) : "");
    reg.scrollTop = reg.scrollHeight;
    btn.disabled = !!b.en_marcha;
    if (b.en_marcha) setTimeout(vigilar, 2000);
  }
  raiz.append(tarjeta("Barrido",
    el("form", { class: "busca", onsubmit: async (ev) => { ev.preventDefault(); btn.disabled = true;
      await api.post("/api/barrido", { fecha: fecha.value, grupos: grupos.value, max: Number(max.value || 0) });
      vigilar(); } }, fecha, grupos, max, btn),
    nota("Trae los partidos del día y el historial de quien juega. El primero es largo; los "
      + "siguientes casi no cuestan. Se puede cortar y seguir."),
    reg));
  if (e.barrido && (e.barrido.en_marcha || (e.barrido.lineas || []).length)) vigilar();

  const faltan = (cat.competiciones || 0) - (cat.identificadas || 0);
  raiz.append(tarjeta("Competiciones",
    el("div", { class: "fila" },
      etiqueta(`${cat.competiciones || 0} competiciones`),
      etiqueta(`${cat.masculinas || 0} masculinas`),
      etiqueta(`${cat.femeninas || 0} femeninas`, "azul"),
      etiqueta(`${cat.identificadas || 0} identificadas`, faltan ? "ambar" : "verde")),
    faltan
      ? el("div", { class: "bloque" },
          msg(`Faltan ${faltan} competiciones por identificar. Los ids de Sofascore no se adivinan: `
            + "el barrido las busca solo la primera vez que hay red, y comprueba país y género "
            + "antes de guardar ninguna.", "ojo"),
          el("details", {}, el("summary", {}, "Cuáles faltan"),
            el("p", { class: "peq gris" },
              Object.values(cat.por_grupo || {}).flatMap((g) => g.faltan || []).join(" · "))))
      : nota("Todo el catálogo identificado.")));

  const arb = el("div", {});
  const cajaArb = el("input", { class: "campo", id: "arb", placeholder: "Nombre del árbitro", autocomplete: "off" });
  raiz.append(tarjeta("Árbitro",
    el("form", { class: "busca", onsubmit: async (ev) => { ev.preventDefault();
      if (!cajaArb.value.trim()) return;
      arb.replaceChildren(espera());
      const a = await api.h("perfil_de_arbitro", { arbitro: cajaArb.value.trim() });
      if (fallo(a)) { arb.replaceChildren(fallo(a)); return; }
      arb.replaceChildren(cifras([[a.por_partido.amarillas, "amarillas"], [a.por_partido.rojas, "rojas"],
        [a.por_partido.penaltis, "penaltis"], [a.por_partido.faltas, "faltas"]]),
        el("p", { class: "peq gris" }, `${a.partidos_mirados} partidos · al local `
          + `${a.reparto_de_tarjetas.al_local}, al visitante ${a.reparto_de_tarjetas.al_visitante} · `
          + `gana el local ${a.victorias_locales}`),
        nota(a.aviso));
    } }, cajaArb, el("button", { class: "btn", type: "submit" }, "Ver")), arb));

  const libs = e.librerias || {};
  raiz.append(tarjeta("Fuentes y modelo",
    el("div", { class: "fila" }, etiqueta("sofascore", "verde"),
      ...(e.fuentes || []).map((f) => etiqueta(f, "verde")),
      ...Object.entries(libs).map((par) => etiqueta(
        par[0] + (par[1].instalado ? " " + (par[1].version || "") : " (falta)"),
        par[1].instalado ? "verde" : "hueca"))),
    el("p", { class: "peq gris" }, "Modelo del analista: ", el("b", {}, e.modelo || "—"),
      ". Las librerías externas dan FBref, Transfermarkt y SoFIFA: ",
      el("code", {}, "pip install ScraperFC soccerdata")),
    (e.briefings || []).length ? el("div", { class: "fila" }, el("span", { class: "mini" }, "briefings"),
      ...e.briefings.slice(0, 8).map((f) => el("a", { class: "eti", href: `#/hoy/${f}` }, f))) : null));

  raiz.append(ajustes(e));
};

function ajustes(e) {
  const clave = el("input", { class: "campo", id: "clave", type: "password", value: api.clave,
    placeholder: "Clave del servidor (si arrancó con --clave)" });
  return tarjeta("Ajustes",
    el("form", { class: "busca", onsubmit: (ev) => { ev.preventDefault(); api.clave = clave.value;
      guardar("clave", clave.value); ir("#/memoria", true); } },
      clave, el("button", { class: "btn plano", type: "submit" }, "Guardar")),
    el("div", { class: "fila" }, el("span", { class: "mini" }, "tema"),
      ...[["auto", "Automático"], ["light", "Claro"], ["dark", "Oscuro"]].map((par) =>
        el("button", { class: "btn plano s", onclick: () => tema(par[0]) }, par[1]))),
    el("p", { class: "peq gris" }, `cancha ${e.version || ""} · `
      + String(e.hora || "").replace("T", " ").slice(0, 16)));
}

function tema(v) {
  guardar("tema", v);
  if (v === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", v);
}

/* ═══════════════════════════════════════════════════════════ rutas ═══ */
const NAV = [
  ["hoy", "Hoy", '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'],
  ["seguro", "Seguro", '<path d="M12 3l7 3v6c0 4-3 7.5-7 9-4-1.5-7-5-7-9V6z"/><path d="M9 12l2 2 4-4"/>'],
  ["analista", "Analista", '<path d="M21 12a8.5 8.5 0 1 1-3.4-6.8"/><path d="M8 11h.01M12 11h.01M16 11h.01"/><path d="M7 19.5L5 22v-4"/>'],
  ["buscar", "Buscar", '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/>'],
  ["memoria", "Memoria", '<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>'],
];
function nav(activa) {
  $("#nav").replaceChildren(...NAV.map((fila) =>
    el("a", { href: "#/" + fila[0], class: fila[0] === activa ? "on" : "" },
      el("span", { html: svg(fila[2]) }), fila[1], el("span", { class: "punto" }))));
}
function ir(hash, forzar) { if (location.hash === hash && forzar) pintar(); else location.hash = hash; }

let actual = "";
async function pintar() {
  const partes = location.hash.replace(/^#\/?/, "").split("/");
  const nombre = V[partes[0]] ? partes[0] : "hoy";
  nav(nombre);
  actual = location.hash;
  const raiz = $("#vista");
  try { await V[nombre](raiz, partes.slice(1)); }
  catch (err) { raiz.append(msg("Algo ha fallado en la página: " + err.message, "mal")); }
  if (location.hash === actual) window.scrollTo({ top: 0 });
}
async function pulso() {
  const e = await api.get("/api/estado");
  const nodo = $("#pulso");
  if (!e || e.error) {
    nodo.replaceChildren(el("span", { class: "led mal" }),
      el("span", {}, e && e.sin_clave ? "hace falta la clave" : "sin servidor"));
    return;
  }
  const m = e.memoria || {};
  nodo.replaceChildren(el("span", { class: "led " + (m.partidos ? "" : "off") }),
    el("span", {}, m.partidos ? `${m.partidos} partidos` : "memoria vacía"));
}

tema(leer("tema", "auto"));
window.addEventListener("hashchange", pintar);
pintar(); pulso();
if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
  navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
