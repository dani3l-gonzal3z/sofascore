<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cancha</title>
<meta name="description" content="Los partidos del día, lo que casi siempre pasa, y un analista local que busca los datos por ti.">
<meta name="theme-color" content="#0A6B4A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0E0D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="cancha">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icono-180.png">
<link rel="icon" href="/icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* ═══ programa de partido ═══ papel de periódico y césped de noche ═══ */
:root {
  --papel:    #F4F3EE;
  --cal:      #FFFFFF;
  --cal-2:    #EAE9E2;
  --tinta:    #16191A;
  --gris:     #62696A;
  --linea:    #DEDDD4;
  --linea-2:  #C9C8BD;
  --cesped:   #0A6B4A;
  --cesped-t: #E0EFE7;
  --bandera:  #C2410C;
  --bandera-t:#FBEAE1;
  --ambar:    #A16207;
  --ambar-t:  #F7EFDC;
  --azul:     #1D4E89;
  --azul-t:   #E3EAF3;
  --visita:   #8A4B10;

  --r:  10px;
  --r-s: 6px;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --texto: "Public Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sombra: 0 1px 2px rgba(22, 25, 26, .05), 0 6px 20px -12px rgba(22, 25, 26, .18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #0B0E0D; --cal: #141918; --cal-2: #1C2322; --tinta: #E9EDEA;
    --gris: #8D9793; --linea: #242C2A; --linea-2: #333D3A;
    --cesped: #3FBF89; --cesped-t: #12261E;
    --bandera: #F97C4A; --bandera-t: #2E1810;
    --ambar: #D9A441; --ambar-t: #2A2112;
    --azul: #7FA8DC; --azul-t: #152232; --visita: #D89C5A;
    --sombra: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #0B0E0D; --cal: #141918; --cal-2: #1C2322; --tinta: #E9EDEA;
  --gris: #8D9793; --linea: #242C2A; --linea-2: #333D3A;
  --cesped: #3FBF89; --cesped-t: #12261E;
  --bandera: #F97C4A; --bandera-t: #2E1810;
  --ambar: #D9A441; --ambar-t: #2A2112;
  --azul: #7FA8DC; --azul-t: #152232; --visita: #D89C5A;
  --sombra: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--papel); color: var(--tinta);
  font: 400 15.5px/1.5 var(--texto);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  font-variant-numeric: tabular-nums;
}
a { color: inherit; text-decoration-color: var(--linea-2); text-underline-offset: 2px; }
a:hover { text-decoration-color: currentColor; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cesped); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3, .cifra { font-family: var(--display); }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h2 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
h3 { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
     color: var(--gris); margin: 0; }
p { margin: 0; }
code { font: 12.5px var(--mono); background: var(--cal-2); padding: 1px 5px; border-radius: 4px; }
.gris { color: var(--gris); }
.peq { font-size: 13px; }
.mini { font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--gris);
        font-weight: 600; }

/* ── armazón ───────────────────────────────────────────────────────── */
.app { display: grid; grid-template-rows: auto 1fr auto; min-height: 100%; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--papel); border-bottom: 1px solid var(--linea);
  padding: 10px 16px; display: flex; align-items: center; gap: 10px;
}
.marca { font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -.03em; }
.marca::before {
  content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 7px;
  border: 2px solid var(--cesped); border-radius: 50%; vertical-align: 1px;
}
.pulso { margin-left: auto; display: flex; align-items: center; gap: 7px; }
.led { width: 7px; height: 7px; border-radius: 50%; background: var(--cesped); flex: none; }
.led.off { background: var(--ambar); }
.led.mal { background: var(--bandera); }
main { width: 100%; max-width: 940px; margin: 0 auto; padding: 18px 16px 28px;
       display: grid; gap: 18px; align-content: start; min-width: 0; }
main > * { min-width: 0; max-width: 100%; }

nav.barra {
  position: sticky; bottom: 0; z-index: 20;
  background: var(--papel); border-top: 1px solid var(--linea);
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px;
  padding: 5px 6px calc(5px + env(safe-area-inset-bottom, 0px));
}
nav.barra a {
  text-decoration: none; color: var(--gris); display: grid; justify-items: center; gap: 3px;
  padding: 6px 2px 4px; border-radius: 8px; font-size: 10.5px; font-weight: 600;
  letter-spacing: .02em;
}
nav.barra svg { width: 21px; height: 21px; stroke: currentColor; fill: none;
                stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
nav.barra a.on { color: var(--tinta); }
nav.barra a.on svg { stroke: var(--cesped); }
nav.barra a .punto { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
nav.barra a.on .punto { background: var(--cesped); }

@media (min-width: 860px) {
  .app { grid-template-columns: 208px 1fr; grid-template-rows: auto 1fr; }
  header.top { grid-column: 1 / -1; padding: 12px 22px; }
  nav.barra {
    grid-row: 2; grid-column: 1; position: sticky; align-self: start; bottom: auto;
    top: calc(53px + env(safe-area-inset-top, 0px));
    display: flex; flex-direction: column; gap: 1px; background: none;
    border: none; border-right: 1px solid var(--linea); padding: 18px 12px; min-height: 70vh;
  }
  nav.barra a { display: flex; flex-direction: row; align-items: center; gap: 11px;
                padding: 9px 11px; font-size: 14.5px; letter-spacing: 0; }
  nav.barra a.on { background: var(--cal); box-shadow: var(--sombra); }
  nav.barra a .punto { display: none; }
  main { grid-column: 2; padding: 26px 30px 60px; max-width: 900px; margin: 0; }
}

/* ── piezas ────────────────────────────────────────────────────────── */
.bloque { display: grid; gap: 11px; min-width: 0; }
.tarjeta { background: var(--cal); border: 1px solid var(--linea); border-radius: var(--r);
           padding: 14px 15px; display: grid; gap: 11px; min-width: 0; }
/* `minmax(0, 1fr)` en vez de la columna automática: sin esto una tabla ancha
   estira la rejilla entera y la página se desplaza a lo ancho en el móvil,
   que es justo lo que no puede pasar. */
main, .tarjeta, .bloque, .detalle, .dia, details {
  grid-template-columns: minmax(0, 1fr);
}
.tarjeta > *, .bloque > *, .detalle > * { min-width: 0; max-width: 100%; }
details { min-width: 0; max-width: 100%; display: grid; gap: 8px; }
details > * { min-width: 0; max-width: 100%; }
details > summary { overflow-wrap: anywhere; }
.titular { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.titular .resto { margin-left: auto; }
hr.hr { height: 1px; background: var(--linea); border: 0; margin: 2px 0; }
.fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }

.btn {
  border: 1px solid var(--cesped); background: var(--cesped); color: var(--papel);
  padding: 9px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;
  white-space: nowrap; transition: filter .12s ease;
}
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: progress; }
.btn.plano { background: transparent; color: var(--tinta); border-color: var(--linea-2); }
.btn.plano:hover { background: var(--cal-2); filter: none; }
.btn.s { padding: 5px 10px; font-size: 13px; border-radius: 7px; }
a.btn { text-decoration: none; display: inline-block; }

input.campo, select.campo, textarea.campo {
  background: var(--cal); border: 1px solid var(--linea-2); border-radius: 8px;
  padding: 9px 12px; min-width: 0; flex: 1 1 180px; max-width: 100%;
}
input.campo::placeholder, textarea.campo::placeholder { color: var(--gris); }
form.busca { display: flex; gap: 8px; flex-wrap: wrap; }

.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%;
       background: var(--cal-2); border-radius: 9px; padding: 3px;
       gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 7px;
              font-size: 13.5px; font-weight: 600; color: var(--gris); cursor: pointer; }
.seg button.on { background: var(--cal); color: var(--tinta); box-shadow: var(--sombra); }

.eti { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700;
       letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px;
       background: var(--cal-2); color: var(--gris); white-space: nowrap; text-decoration: none; }
.eti.verde  { background: var(--cesped-t); color: var(--cesped); }
.eti.roja   { background: var(--bandera-t); color: var(--bandera); }
.eti.ambar  { background: var(--ambar-t); color: var(--ambar); }
.eti.azul   { background: var(--azul-t); color: var(--azul); }
.eti.hueca  { background: none; border: 1px dashed var(--linea-2); }

/* Un mensaje de error trae a veces una URL entera sin espacios, y eso ensancha
   la página en el móvil. Que rompa por donde haga falta. */
.nota, .msg, .peq { overflow-wrap: anywhere; min-width: 0; }
.nota { font-size: 13px; color: var(--gris); font-style: italic; line-height: 1.5; }
.msg { border-left: 2px solid var(--azul); background: var(--azul-t); color: var(--tinta);
       padding: 9px 12px; border-radius: 0 var(--r-s) var(--r-s) 0; font-size: 13.5px; }
.msg.mal { border-color: var(--bandera); background: var(--bandera-t); }
.msg.ojo { border-color: var(--ambar); background: var(--ambar-t); }
.msg.bien { border-color: var(--cesped); background: var(--cesped-t); }
.espera { color: var(--gris); font-size: 13.5px; display: flex; align-items: center; gap: 9px;
          padding: 14px 0; }
.espera::before { content: ""; width: 14px; height: 14px; border: 2px solid var(--linea-2);
                  border-top-color: var(--cesped); border-radius: 50%;
                  animation: giro .8s linear infinite; flex: none; }
@keyframes giro { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ── tarjeta de partido: plegada por defecto ───────────────────────── */
.dia { display: grid; gap: 7px; min-width: 0; }
.liga-tit { display: flex; align-items: baseline; gap: 9px; padding: 10px 2px 2px; }
.liga-tit .n { font-size: 11.5px; color: var(--gris); font-weight: 600; }

.pdo { background: var(--cal); border: 1px solid var(--linea); border-radius: var(--r);
       overflow: hidden; transition: border-color .14s ease, box-shadow .14s ease; min-width: 0; }
.pdo:hover { border-color: var(--linea-2); }
.pdo.abierto { border-color: var(--linea-2); box-shadow: var(--sombra); }
.pdo > .cabeza { width: 100%; border: 0; background: none; text-align: left; cursor: pointer;
                 padding: 11px 13px; display: grid; gap: 7px; }
.pdo .arriba { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.pdo .hora { font-family: var(--display); font-weight: 600; font-size: 13.5px; color: var(--gris);
             flex: none; width: 42px; }
.pdo .equipos { font-weight: 600; font-size: 15.5px; letter-spacing: -.01em; flex: 1 1 auto;
                min-width: 0; overflow-wrap: anywhere; }
.pdo .equipos .sep { color: var(--gris); font-weight: 400; margin: 0 5px; }
.pdo .abajo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-left: 52px; }
@media (max-width: 470px) { .pdo .abajo { padding-left: 0; } }

.chevron { flex: none; width: 15px; height: 15px; stroke: var(--gris); fill: none;
           stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
           transition: transform .16s ease; }
.pdo.abierto .chevron { transform: rotate(180deg); }
.detalle { border-top: 1px solid var(--linea); padding: 14px 15px 16px; display: grid; gap: 14px;
           min-width: 0; }

.prob { display: flex; height: 5px; width: 104px; border-radius: 3px; overflow: hidden;
        background: var(--cal-2); flex: none; }
.prob i { display: block; height: 100%; }
.prob .l { background: var(--cesped); }
.prob .e { background: var(--linea-2); }
.prob .v { background: var(--visita); }

.forma { display: inline-flex; gap: 2.5px; }
.forma i { width: 7px; height: 7px; border-radius: 2px; background: var(--linea-2); display: block; }
.forma i.g { background: var(--cesped); }
.forma i.p { background: var(--bandera); }

/* ── comparativas ──────────────────────────────────────────────────── */
.vs { display: grid; gap: 7px; }
.vs .m { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 9px;
         font-size: 13.5px; }
.vs .m .et { grid-column: 1 / -1; font-size: 10.5px; letter-spacing: .07em;
             text-transform: uppercase; color: var(--gris); font-weight: 600; margin-bottom: -4px; }
.vs .pista { display: flex; height: 6px; border-radius: 3px; overflow: hidden;
             background: var(--cal-2); }
.vs .pista i { display: block; height: 100%; }
.vs .pista .l { background: var(--cesped); }
.vs .pista .v { background: var(--visita); }
.vs .izq { text-align: right; font-weight: 600; }
.vs .der { font-weight: 600; }

.rasgos { display: grid; gap: 5px; }
.rasgo { display: grid; grid-template-columns: 1fr 92px 46px; gap: 9px; align-items: center;
         font-size: 13.5px; }
.rasgo .eje { position: relative; height: 6px; background: var(--cal-2); border-radius: 3px; }
.rasgo .eje::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px;
                     width: 1px; background: var(--linea-2); }
.rasgo .eje i { position: absolute; top: 0; height: 100%; border-radius: 3px;
                background: var(--cesped); }
.rasgo .eje i.neg { background: var(--visita); }
.rasgo .v { text-align: right; font-weight: 700; font-family: var(--display); }

.cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(102px, 1fr)); gap: 8px; }
.caja { background: var(--cal-2); border-radius: var(--r-s); padding: 9px 11px; min-width: 0; }
.caja .cifra { font-size: 21px; font-weight: 700; line-height: 1.1; display: block;
               letter-spacing: -.01em; }
.caja .et { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--gris);
            font-weight: 600; display: block; margin-top: 2px; }
.tres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; text-align: center; }

.lista { list-style: none; margin: 0; padding: 0; display: grid; }
.lista li { padding: 9px 0; border-top: 1px solid var(--linea); display: flex; gap: 9px;
            align-items: baseline; flex-wrap: wrap; font-size: 14px; min-width: 0; }
.lista li:first-child { border-top: 0; padding-top: 2px; }
.lista li.pulsable { cursor: pointer; }
.lista li.pulsable:hover { background: var(--cal-2); }

/* Una tabla ancha se desliza dentro de su caja; para que `overflow` funcione
   de verdad dentro de un grid, la caja necesita poder encogerse (`min-width`). */
.desliza { overflow-x: auto; margin: 0 -2px; min-width: 0; max-width: 100%; }
table.tb { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.tb th, table.tb td { padding: 6px 8px; text-align: left; border-top: 1px solid var(--linea);
                           white-space: nowrap; }
table.tb th { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
              color: var(--gris); font-weight: 600; border-top: 0; }
table.tb td.n, table.tb th.n { text-align: right; }
table.tb td:first-child, table.tb th:first-child { white-space: normal; min-width: 130px; }

.grafico svg { width: 100%; height: auto; display: block; }
.leyenda { display: flex; gap: 14px; font-size: 12.5px; flex-wrap: wrap; color: var(--gris); }
.leyenda i { display: inline-block; width: 11px; height: 3px; border-radius: 2px;
             vertical-align: middle; margin-right: 5px; }

/* ── casi seguro ───────────────────────────────────────────────────── */
.av { display: grid; gap: 8px; border-left: 3px solid var(--linea-2); padding-left: 12px; }
.av.alto { border-color: var(--bandera); }
.av.medio { border-color: var(--ambar); }
.av .cab { display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap; }
.av .pc { font-family: var(--display); font-size: 25px; font-weight: 800; line-height: 1;
          letter-spacing: -.02em; flex: none; }
.barra-conf { position: relative; height: 5px; background: var(--cal-2); border-radius: 3px; }
.barra-conf i { position: absolute; left: 0; top: 0; height: 100%; border-radius: 3px;
                background: var(--cesped); }
.barra-conf b { position: absolute; top: -3px; width: 2px; height: 11px; background: var(--tinta);
                border-radius: 1px; }

/* ── analista ──────────────────────────────────────────────────────── */
.chat { display: grid; gap: 14px; }
.burbuja { display: grid; gap: 7px; min-width: 0; }
.burbuja.yo { justify-items: end; }
.burbuja.yo .txt { background: var(--cesped); color: var(--papel);
                   border-radius: 12px 12px 3px 12px; padding: 9px 13px; max-width: 86%;
                   overflow-wrap: anywhere; }
.burbuja.el .txt { background: var(--cal); border: 1px solid var(--linea);
                   border-radius: 12px 12px 12px 3px; padding: 11px 14px; white-space: pre-wrap;
                   overflow-wrap: anywhere; }
.pasos { display: flex; flex-wrap: wrap; gap: 5px; }
.paso { font: 11.5px var(--mono); background: var(--cal-2); color: var(--gris);
        padding: 2px 8px; border-radius: 999px; max-width: 100%; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
.paso.vivo { background: var(--cesped-t); color: var(--cesped); }
.redactar { display: flex; gap: 8px; align-items: flex-end; position: sticky; bottom: 0;
            background: var(--papel); padding: 8px 0 2px; }
.redactar textarea { resize: none; max-height: 140px; min-height: 42px; line-height: 1.4; }
.sugeridas { display: flex; gap: 6px; flex-wrap: wrap; }
.sug { border: 1px solid var(--linea-2); background: var(--cal); border-radius: 999px;
       padding: 5px 11px; font-size: 13px; cursor: pointer; text-align: left; }
.sug:hover { background: var(--cal-2); }
.sug.on { background: var(--cesped); border-color: var(--cesped); color: #fff; }

/* Una casilla con su texto al lado, que es la forma de elegir a qué llega un
   agente. Cuarenta y cinco de estas caben porque van en `.sugeridas`. */
.casilla { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
           border: 1px solid var(--linea-2); background: var(--cal); border-radius: 999px;
           padding: 4px 11px 4px 8px; cursor: pointer; }
.casilla:hover { background: var(--cal-2); }
.casilla input { margin: 0; flex: none; }

.registro { font: 12.5px/1.45 var(--mono); background: var(--cal-2); border-radius: var(--r-s);
            padding: 10px 12px; max-height: 240px; overflow: auto; white-space: pre-wrap; }
details > summary { cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--cesped);
                    list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸ "; }
details[open] > summary::before { content: "▾ "; }
/* El QR se dibuja con una rejilla de cuadraditos. Blanco y negro fijos, no los
   del tema: un QR con poco contraste no lo lee la cámara. */
.qr-marco { background: #fff; padding: 14px; border-radius: var(--r-s); width: max-content;
            max-width: 100%; border: 1px solid var(--linea-2); }
.qr { display: grid; width: min(248px, 62vw); aspect-ratio: 1; }
.qr i { background: #fff; }
.qr i.on { background: #000; }

.vacio { text-align: center; padding: 32px 16px; color: var(--gris); display: grid; gap: 10px;
         justify-items: center; }
.vacio svg { width: 34px; height: 34px; stroke: var(--linea-2); fill: none; stroke-width: 1.5;
             stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="marca">cancha</span>
    <span class="pulso peq gris" id="pulso"><span class="led off"></span><span>…</span></span>
  </header>
  <main id="vista" aria-live="polite"></main>
  <nav class="barra" id="nav"></nav>
</div>

<script>
/* ═══════════════════════════════════════════════════════ utilidades ═══ */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs, ...hijos) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const h of hijos.flat(3)) {
    if (h === null || h === undefined || h === false) continue;
    n.append(h.nodeType ? h : document.createTextNode(String(h)));
  }
  return n;
}
const n2 = (v, d = 2) => (v === null || v === undefined || isNaN(v) ? "—" : Number(v).toFixed(d));
const pc = (v, d = 0) => (v === null || v === undefined || isNaN(v) ? "—" : (Number(v) * 100).toFixed(d) + "%");
const hoy = () => new Date().toISOString().slice(0, 10);
const guardar = (k, v) => { try { localStorage.setItem("cancha." + k, JSON.stringify(v)); } catch (e) {} };
const leer = (k, d) => { try { const v = localStorage.getItem("cancha." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const svg = (d, clase = "") => `<svg viewBox="0 0 24 24" aria-hidden="true" class="${clase}">${d}</svg>`;

/* La clave puede venir en la dirección: es lo que lleva el QR que dibuja
   `cancha web --lan`, para no tener que teclearla en el móvil. Se guarda y se
   borra de la barra al momento, que una clave no tiene por qué quedarse en el
   historial ni salir en una captura. */
function claveDeLaUrl() {
  try {
    const dada = new URLSearchParams(location.search).get("clave");
    if (!dada) return null;
    guardar("clave", dada);
    history.replaceState(null, "", location.pathname + location.hash);
    return dada;
  } catch (e) { return null; }
}

const api = {
  clave: claveDeLaUrl() || leer("clave", ""),
  cab() { const h = { "Content-Type": "application/json" }; if (this.clave) h["X-Clave"] = this.clave; return h; },
  async pedir(ruta, metodo, cuerpo) {
    try {
      const r = await fetch(ruta, { method: metodo, headers: this.cab(),
        body: cuerpo === undefined ? undefined : JSON.stringify(cuerpo) });
      const d = await r.json().catch(() => ({ error: "La respuesta del servidor no era JSON." }));
      if (r.status === 401) d.sin_clave = true;
      return d;
    } catch (e) { return { error: "No se puede hablar con el servidor: " + e.message }; }
  },
  get(ruta) { return this.pedir(ruta, "GET"); },
  post(ruta, cuerpo) { return this.pedir(ruta, "POST", cuerpo || {}); },
  h(nombre, args) { return this.post("/api/herramienta/" + nombre, args || {}); },
};

/* ── componentes comunes ─────────────────────────────────────────── */
const espera = (t = "Cargando…") => el("div", { class: "espera" }, t);
const nota = (t) => (t ? el("p", { class: "nota" }, t) : null);
const msg = (t, c = "") => el("div", { class: "msg " + c }, t);
function fallo(d) {
  if (!d) return msg("Sin respuesta del servidor.", "mal");
  if (d.sin_clave) return el("div", { class: "msg mal" }, "Hace falta la clave del servidor. ",
    el("a", { href: "#/memoria" }, "Ponla en Memoria →"));
  if (d.error) return msg(d.error, "mal");
  if (d.disponible === false) return msg(d.nota || "Sin datos todavía.", "ojo");
  return null;
}
function tarjeta(titulo, ...hijos) {
  const t = el("section", { class: "tarjeta" });
  if (titulo) t.append(el("div", { class: "titular" }, el("h3", {}, titulo)));
  t.append(...hijos.flat(2).filter(Boolean));
  return t;
}
function vacio(icono, titulo, ...resto) {
  return el("div", { class: "vacio" }, el("span", { html: svg(icono) }),
    el("h2", {}, titulo), ...resto.filter(Boolean));
}
const etiqueta = (texto, tono = "") => el("span", { class: "eti " + tono }, texto);
const TONOS = {
  "señal": "roja", "casi seguro": "roja", "indicio": "ambar", "probable": "ambar",
  "sin muestra": "hueca", "es la tasa base": "", "dentro de lo normal": "",
  "solo descriptivo": "", "poco": "",
};
const veredicto = (v) => etiqueta(v, TONOS[v] === undefined ? "" : TONOS[v]);

/* La comprobación fuera de muestra: medido con el 70 % más viejo, ¿se cumplió
   en el 30 % más nuevo? Es lo único de aquí que no participó en elegir el
   patrón, así que va junto al número, no escondido en una nota al pie. */
const TONOS_FUERA = { aguanta: "verde", "se cae": "roja", "sin muestra": "hueca" };
const fueraDeMuestra = (f) => (f
  ? etiqueta(f.veredicto === "aguanta" ? "aguanta después"
      : f.veredicto === "se cae" ? "se cae después" : "sin comprobar",
    TONOS_FUERA[f.veredicto] || "")
  : null);

function forma(resultados) {
  const c = el("span", { class: "forma", title: String(resultados || "").split("").join(" ") });
  for (const r of String(resultados || "").slice(0, 6)) c.append(el("i", { class: r.toLowerCase() }));
  return c;
}
function barraProb(p) {
  if (!p) return null;
  const l = (p.local || 0) * 100, e = (p.empate || 0) * 100, v = (p.visitante || 0) * 100;
  return el("span", { class: "prob", title: `${pc(p.local)} local · ${pc(p.empate)} empate · ${pc(p.visitante)} visitante` },
    el("i", { class: "l", style: `width:${l}%` }), el("i", { class: "e", style: `width:${e}%` }),
    el("i", { class: "v", style: `width:${v}%` }));
}
function comparar(filas, local, visitante) {
  const c = el("div", { class: "vs" });
  if (local) c.append(el("div", { class: "leyenda" },
    el("span", {}, el("i", { style: "background:var(--cesped)" }), local),
    el("span", {}, el("i", { style: "background:var(--visita)" }), visitante)));
  for (const f of filas) {
    const a = Number(String(f.local === null || f.local === undefined ? "" : f.local).replace("%", "")) || 0;
    const b = Number(String(f.visitante === null || f.visitante === undefined ? "" : f.visitante).replace("%", "")) || 0;
    const t = a + b || 1;
    c.append(el("div", { class: "m" }, el("span", { class: "et" }, f.nombre),
      el("span", { class: "izq" }, f.local === null || f.local === undefined ? "—" : f.local),
      el("span", { class: "pista" }, el("i", { class: "l", style: `width:${a / t * 100}%` }),
        el("i", { class: "v", style: `width:${b / t * 100}%` })),
      el("span", { class: "der" }, f.visitante === null || f.visitante === undefined ? "—" : f.visitante)));
  }
  return c;
}
function rasgos(dimensiones, limite = 6) {
  const filas = Object.entries(dimensiones || {})
    .filter(([, d]) => d && d.diferencia !== undefined && d.diferencia !== null)
    .sort((x, y) => Math.abs(y[1].diferencia) - Math.abs(x[1].diferencia)).slice(0, limite);
  if (!filas.length) return nota("Sin media de liga con la que comparar todavía.");
  const c = el("div", { class: "rasgos" });
  for (const [nombre, d] of filas) {
    const v = Math.max(-1, Math.min(1, d.diferencia));
    const ancho = Math.abs(v) * 50;
    c.append(el("div", { class: "rasgo" },
      el("span", {}, nombre.replace(/_/g, " "), " ",
        el("span", { class: "gris peq" }, `${d.valor} · liga ${d.media_liga}`)),
      el("span", { class: "eje" }, el("i", { class: v < 0 ? "neg" : "",
        style: `left:${v < 0 ? 50 - ancho : 50}%;width:${ancho}%` })),
      el("span", { class: "v" }, (v > 0 ? "+" : "") + Math.round(d.diferencia * 100) + "%")));
  }
  return c;
}
const cifras = (pares) => el("div", { class: "cifras" }, ...pares.filter(Boolean).map(([v, et]) =>
  el("div", { class: "caja" }, el("span", { class: "cifra" }, v === null || v === undefined ? "—" : v),
    el("span", { class: "et" }, et))));
function tabla(cols, filas, leerCelda) {
  return el("div", { class: "desliza" }, el("table", { class: "tb" },
    el("thead", {}, el("tr", {}, ...cols.map((c) => el("th", { class: c.n ? "n" : "" }, c.t)))),
    el("tbody", {}, ...filas.map((f) => el("tr", {}, ...cols.map((c) => {
      const v = leerCelda ? leerCelda(f, c) : f[c.k];
      return el("td", { class: c.n ? "n" : "" }, v && v.nodeType ? v : (v === null || v === undefined ? "—" : v));
    }))))));
}
/* `replaceChildren` convierte un null en la palabra «null» dentro de la
   página, que es justo lo que no quieres ver. Esto lo filtra como hace `el`. */
function poner(nodo, ...hijos) {
  nodo.replaceChildren(...hijos.flat(3)
    .filter((h) => h !== null && h !== undefined && h !== false));
}

/* Una sección que no pide nada hasta que se abre. Con diez secciones por
   partido, traerlas todas de golpe sería una ráfaga de peticiones para leer
   una; así el móvil solo paga por lo que mira. */
function plegable(titulo, cargar, abierta) {
  const cuerpo = el("div", { class: "bloque" });
  const caja = el("details", abierta ? { open: true } : {}, el("summary", {}, titulo), cuerpo);
  let pedido = false;
  async function traer() {
    if (pedido) return;
    pedido = true;
    cuerpo.replaceChildren(espera());
    try {
      const nodos = await cargar();
      cuerpo.replaceChildren(...[].concat(nodos).filter(Boolean));
    } catch (err) { cuerpo.replaceChildren(msg("Ha fallado: " + err.message, "mal")); }
  }
  caja.addEventListener("toggle", () => { if (caja.open) traer(); });
  if (abierta) traer();
  return caja;
}

/* El JSON tal cual. No es bonito, pero es la diferencia entre poder mirar algo
   desde el móvil y tener que ir al ordenador a por el terminal. */
const volcado = (o) => el("pre", { class: "registro" }, JSON.stringify(o, null, 1));

/* Traer a la memoria todo el contexto de un partido: los últimos de cada
   equipo, lo que han jugado entre ellos y lo del árbitro. Primero se pregunta
   qué costaría y se enseña; pedir doscientas cosas a un servidor ajeno sin
   decir cuántas son no es pedir, es disparar. */
function abastecer(idPartido, alTerminar) {
  const cuerpo = el("div", { class: "bloque" });
  const boton = el("button", { class: "btn", disabled: true }, "Mirando qué falta…");
  boton.addEventListener("click", async () => {
    boton.disabled = true;
    boton.textContent = "Trayendo…";
    cuerpo.replaceChildren(espera("Esto tarda: son varias peticiones a Sofascore, "
      + "de tres en tres por segundo. Puedes irte a otra pantalla."));
    const d = await api.h("abastecer_partido", { partido: String(idPartido) });
    boton.disabled = false;
    boton.textContent = "Traer lo que falte";
    const err = fallo(d);
    if (err) { cuerpo.replaceChildren(err); return; }
    cuerpo.replaceChildren(
      cifras([[d.guardados, "traídos ahora"], [d.ya_estaban, "ya estaban"],
        [d.sin_estadisticas || 0, "sin estadísticas"], [d.peticiones, "peticiones"]]),
      d.completo ? msg("Ya está todo el contexto de este partido en la memoria.")
        : msg("Falta algo por traer: vuelve a darle y sigue por donde lo dejó.", "ojo"),
      nota(d.como_leerlo));
    if (alTerminar) alTerminar();
  });

  api.h("abastecer_partido", { partido: String(idPartido), solo_plan: true }).then((plan) => {
    const err = fallo(plan);
    if (err) { cuerpo.replaceChildren(err); boton.remove(); return; }
    boton.disabled = plan.hay_que_pedir === 0;
    boton.textContent = plan.hay_que_pedir
      ? `Traer ${plan.hay_que_pedir} partidos` : "Nada que traer";
    cuerpo.replaceChildren(
      cifras([[plan.en_total, "hacen falta"], [plan.ya_estaban, "ya están"],
        [plan.hay_que_pedir, "faltan"], [plan.peticiones_estimadas, "peticiones"]]),
      el("p", { class: "peq gris" },
        `${plan.de_cada_uno.local} del local · ${plan.de_cada_uno.visitante} del visitante · `
        + `${plan.entre_ellos} entre ellos`
        + (plan.arbitro ? ` · ${plan.del_arbitro} de ${plan.arbitro}` : "")),
      /* Los que la fuente no tiene con detalle se dicen aparte. Si no, se
         quedaban en «faltan 2» para siempre y parecía que no se guardaba. */
      plan.sin_estadisticas
        ? nota(`${plan.sin_estadisticas} de esos partidos no tienen estadísticas en `
            + "Sofascore: se pidieron una vez y no se volverán a pedir. Es normal en "
            + "categorías menores y partidos viejos.")
        : null,
      plan.hay_que_pedir
        ? nota("La segunda vez que pidas un partido de esta liga costará mucho menos: "
            + "los últimos de un equipo son también los últimos de sus rivales.")
        : nota("Todo el contexto de este partido ya está guardado."));
  });
  cuerpo.append(espera("Mirando qué hace falta…"));
  return tarjeta("Memoria de este partido", cuerpo, boton);
}

function carrera(c) {
  if (!c || !c.disponible || !(c.serie || []).length) return null;
  const nombres = Object.keys(c.total || {});
  const W = 640, H = 190, m = { l: 32, r: 14, t: 12, b: 24 };
  const maxX = Math.max(90, ...c.serie.map((p) => p.minuto || 0));
  const maxY = Math.max(0.6, ...nombres.map((k) => c.total[k])) * 1.15;
  const x = (v) => m.l + (v / maxX) * (W - m.l - m.r);
  const y = (v) => H - m.b - (v / maxY) * (H - m.t - m.b);
  const col = ["var(--cesped)", "var(--visita)"];
  const paso = maxY > 2.4 ? 1 : 0.5;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="xG acumulado minuto a minuto">`;
  for (let v = 0; v <= maxY; v += paso)
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--linea)" stroke-width="1"/>`
       + `<text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--gris)">${v.toFixed(1)}</text>`;
  for (const min of [0, 15, 30, 45, 60, 75, 90])
    s += `<text x="${x(min)}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="var(--gris)">${min}'</text>`;
  nombres.forEach((k, i) => {
    const pts = [[0, 0], ...c.serie.map((p) => [p.minuto || 0, p[k] || 0])];
    s += `<path d="${pts.map(([a, b], j) => `${j ? "L" : "M"}${x(a).toFixed(1)},${y(b).toFixed(1)}`).join(" ")}"`
       + ` fill="none" stroke="${col[i]}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    const u = pts[pts.length - 1];
    s += `<circle cx="${x(u[0])}" cy="${y(u[1])}" r="3.5" fill="${col[i]}"/>`;
  });
  s += "</svg>";
  return el("div", { class: "bloque grafico" }, el("div", { html: s }),
    el("div", { class: "leyenda" }, ...nombres.map((k, i) =>
      el("span", {}, el("i", { style: `background:${col[i]}` }), `${k} ${n2(c.total[k])}`))),
    c.manda_en_xg ? nota(`Manda en xG ${c.manda_en_xg}${c.desde_el_minuto ? ` desde el minuto ${c.desde_el_minuto}` : ""}.`) : null);
}

const GRUPOS_UI = [["", "Todas"], ["grandes", "Cinco grandes"], ["grandes_f", "Cinco grandes (f)"],
  ["femenino", "Solo femenino"], ["uefa", "UEFA"], ["europeas", "Europa"],
  ["usa", "EE. UU. y México"], ["sudamerica", "Sudamérica"], ["america", "América"]];

/* ═══════════════════════════════════════════════════════════ vistas ═══ */
const V = {};

/* ── HOY ─────────────────────────────────────────────────────────── */
V.hoy = async (raiz, [fecha]) => {
  const directo = fecha === "directo";
  fecha = directo ? hoy() : (fecha || leer("fecha", hoy()));
  const grupos = leer("grupos", "");
  raiz.replaceChildren(el("div", { class: "titular" },
    el("h1", {}, directo ? "En directo" : fecha === hoy() ? "Hoy" : fecha),
    el("div", { class: "resto fila" },
      el("div", { class: "seg" },
        el("button", { class: directo ? "" : "on", onclick: () => ir(`#/hoy/${fecha}`) }, "Agenda"),
        el("button", { class: directo ? "on" : "", onclick: () => ir("#/hoy/directo") }, "Directo")),
      directo ? null : el("input", { class: "campo", type: "date", id: "fecha", value: fecha,
        style: "flex:0 1 148px",
        onchange: (e) => { guardar("fecha", e.target.value); ir(`#/hoy/${e.target.value}`, true); } }),
      el("select", { class: "campo", id: "grupos", style: "flex:0 1 172px",
        onchange: (e) => { guardar("grupos", e.target.value);
          ir(directo ? "#/hoy/directo" : `#/hoy/${fecha}`, true); } },
        ...GRUPOS_UI.map(([v, t]) => el("option", { value: v, selected: v === grupos }, t))))));
  if (directo) return pintarDirecto(raiz);
  raiz.append(espera("Buscando lo que se juega…"));

  let brief = await api.get("/api/briefing/" + fecha);
  if (brief && (brief.error || brief.sin_clave)) brief = null;
  const agenda = brief ? null : await api.h("agenda_del_dia", { fecha, grupos: grupos || undefined });
  raiz.lastChild.remove();
  if (!brief && fallo(agenda)) { raiz.append(fallo(agenda)); return; }

  let partidos = [];
  if (brief) {
    partidos = brief.partidos.map((p) => ({ id: p.partido.id, liga: p.partido.competicion,
      hora: p.partido.hora_utc, local: p.partido.local, visitante: p.partido.visitante, datos: p }));
  } else {
    for (const [liga, lista] of Object.entries(agenda.por_competicion || {}))
      for (const p of lista) {
        const trozos = String(p.partido).split(" - ");
        partidos.push({ id: p.id, liga, hora: p.hora_utc, local: trozos[0],
          visitante: trozos.slice(1).join(" - ") });
      }
  }

  const digest = el("div", {});
  raiz.append(digest);

  if (!partidos.length) {
    raiz.append(vacio('<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/>',
      "No se juega nada",
      el("p", { class: "gris peq" }, "Ese día no hay partidos en las competiciones elegidas."),
      el("a", { class: "btn plano s", href: "#/memoria" }, "Ver el catálogo de ligas")));
    return;
  }

  raiz.append(brief
    ? msg(`Briefing de las ${String(brief.generado || "").slice(11, 16)} UTC · `
        + `${(brief.memoria || {}).partidos || 0} partidos en memoria.`)
    : el("div", { class: "fila" },
        msg("Agenda en directo, sin analizar. Genera el briefing para tener cada partido estudiado.", "ojo"),
        el("button", { class: "btn s", onclick: (e) => generarBriefing(fecha, raiz, e.currentTarget) },
          "Generar briefing")));

  const porLiga = {};
  for (const p of partidos) (porLiga[p.liga || "Otras"] ||= []).push(p);
  for (const [liga, lista] of Object.entries(porLiga).sort((a, b) => a[0].localeCompare(b[0]))) {
    const grupo = el("div", { class: "dia" }, el("div", { class: "liga-tit" },
      el("h3", {}, liga), el("span", { class: "n" }, `${lista.length} partido${lista.length > 1 ? "s" : ""}`)));
    for (const p of lista) grupo.append(tarjetaPartido(p));
    raiz.append(grupo);
  }

  /* El digest de casi seguro llega cuando llega: no bloquea la lista. */
  api.post("/api/seguro", { fecha, grupos: grupos || undefined, umbral: 0.7 }).then((s) => {
    if (!s || s.error || !(s.avisos || []).length) return;
    const porPartido = {};
    for (const a of s.avisos) (porPartido[a.partido_id] ||= []).push(a);
    for (const p of partidos) {
      const suyos = porPartido[p.id] || [];
      p.avisos = suyos;
      const nodo = $(`#p${p.id} .insignias`);
      if (nodo && suyos.length) nodo.prepend(etiqueta(`${suyos.length} casi seguro`, "roja"));
    }
    /* Por patrón, no por aviso: los avisos del mismo patrón llevan los mismos
       números, así que cuatro avisos eran cuatro veces la misma línea. */
    digest.replaceChildren(tarjeta(null,
      el("div", { class: "titular" }, el("h3", {}, "Casi seguro hoy"),
        el("a", { class: "resto peq", href: `#/seguro/hoy/${fecha}` }, "ver todo →")),
      el("ul", { class: "lista" }, ...(s.por_patron || []).slice(0, 4).map((g) => el("li", {},
        el("span", { style: "font-family:var(--display);font-weight:800;font-size:17px;flex:none" }, pc(g.suelo)),
        el("span", { style: "flex:1 1 200px;min-width:0" }, el("b", {}, g.titulo), " — ", g.dice),
        el("span", { class: "gris peq" },
          `${g.casos} casos · ${g.cuantos_partidos} hoy`))))));
  });
};

/* Los partidos que se están jugando ahora. Se refresca solo mientras esta
   vista siga en pantalla: si te vas a otra, el temporizador muere con ella (si
   no, el móvil se pasaría la tarde pidiendo cosas que nadie mira). */
const REFRESCO_DIRECTO = 30000;

async function pintarDirecto(raiz) {
  const caja = el("div", {});
  const sello = el("span", { class: "gris peq" });
  raiz.append(el("div", { class: "fila" },
    msg("Marcadores en vivo, directos de la API: no pasan por la memoria.", ""), sello), caja);
  caja.append(espera("Mirando qué se juega ahora…"));
  const mio = location.hash;

  async function refrescar(primera) {
    const d = await api.h("partidos", { limite: 60 });
    if (location.hash !== mio) return;            // la vista ya no está
    if (fallo(d)) { caja.replaceChildren(fallo(d)); return; }
    const lista = d.partidos || [];
    sello.textContent = `${lista.length} en juego · ${new Date().toLocaleTimeString().slice(0, 5)}`;
    if (!lista.length) {
      caja.replaceChildren(vacio('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
        "Ahora no se juega nada",
        el("p", { class: "gris peq" }, "Vuelve cuando haya partido, o mira la agenda del día.")));
    } else {
      const porLiga = {};
      for (const x of lista) (porLiga[x.competicion || "Otras"] ||= []).push(x);
      caja.replaceChildren(...Object.entries(porLiga)
        .sort((a, b) => a[0].localeCompare(b[0])).map(([liga, suyos]) =>
          el("div", { class: "dia" },
            el("div", { class: "liga-tit" }, el("h3", {}, liga),
              el("span", { class: "n" }, `${suyos.length}`)),
            el("ul", { class: "lista" }, ...suyos.map((x) => el("li", { class: "pulsable",
              onclick: () => ir(`#/buscar/partido/${x.id}`) },
              el("span", { class: "eti roja", style: "flex:none" }, x.estado || "en juego"),
              el("span", { style: "flex:1 1 200px;font-weight:600;min-width:0" }, x.partido),
              el("span", { html: svg('<path d="M9 6l6 6-6 6"/>', "chevron") })))))));
    }
    if (primera || location.hash === mio) setTimeout(() => {
      if (location.hash === mio) refrescar(false);
    }, REFRESCO_DIRECTO);
  }
  return refrescar(true);
}

async function generarBriefing(fecha, raiz, boton) {
  boton.disabled = true; boton.textContent = "Generando…";
  const grupos = leer("grupos", "");
  const d = await api.h("briefing_del_dia", { fecha, grupos: grupos || undefined, recalcular: true });
  if (fallo(d)) { raiz.append(fallo(d)); boton.disabled = false; boton.textContent = "Generar briefing"; }
  else ir(`#/hoy/${fecha}`, true);
}

function tarjetaPartido(p) {
  const d = p.datos;
  const mercado = d && d.mercado && d.mercado.disponible ? d.mercado : null;
  const cuerpo = el("div", { class: "detalle", hidden: true });
  const insignias = el("span", { class: "insignias fila", style: "gap:5px" });
  if (d && (d.duelos || []).length) insignias.append(etiqueta(`${d.duelos.length} duelos`, "azul"));
  if (mercado && mercado.favorito && mercado.favorito.lado)
    insignias.append(etiqueta(`${mercado.favorito.lado} ${mercado.favorito.claridad}`));

  const equipos = (d && d.equipos) || {};
  const formaL = equipos.local && equipos.local.resultados ? equipos.local.resultados.racha : null;
  const formaV = equipos.visitante && equipos.visitante.resultados ? equipos.visitante.resultados.racha : null;

  const cabeza = el("button", { class: "cabeza", type: "button", "aria-expanded": "false",
    onclick: (e) => alternar(e.currentTarget, p, cuerpo) },
    el("div", { class: "arriba" },
      el("span", { class: "hora" }, p.hora || "—"),
      el("span", { class: "equipos" }, p.local, el("span", { class: "sep" }, "–"), p.visitante),
      el("span", { html: svg('<path d="M6 9l6 6 6-6"/>', "chevron") })),
    el("div", { class: "abajo peq gris" },
      barraProb(mercado ? mercado.probabilidades : null),
      formaL ? el("span", { class: "fila", style: "gap:5px" }, forma(formaL),
        el("span", { class: "gris" }, "/"), forma(formaV)) : null,
      insignias));
  return el("article", { class: "pdo", id: "p" + p.id }, cabeza, cuerpo);
}

async function alternar(cabeza, p, cuerpo) {
  const caja = cabeza.parentElement;
  const abierto = !cuerpo.hidden;
  cuerpo.hidden = abierto;
  caja.classList.toggle("abierto", !abierto);
  cabeza.setAttribute("aria-expanded", String(!abierto));
  if (abierto || cuerpo.dataset.cargado) return;
  cuerpo.dataset.cargado = "1";
  cuerpo.replaceChildren(espera("Montando la previa…"));
  const pv = await api.h("previa_de_partido", { partido: String(p.id) });
  cuerpo.replaceChildren(...previaDentro(pv, p).filter(Boolean));
}

function previaDentro(pv, p) {
  const err = fallo(pv);
  if (err) return [err];
  const partes = [];
  const mercado = pv.mercado && pv.mercado.disponible ? pv.mercado : null;
  if (mercado) {
    const pr = mercado.probabilidades || {};
    const lectura = mercado.favorito && mercado.favorito.lectura;
    partes.push(el("div", { class: "bloque" }, el("h3", {}, "Lo que dice el mercado"),
      el("div", { class: "tres" },
        el("div", { class: "caja" }, el("span", { class: "cifra" }, pc(pr.local)), el("span", { class: "et" }, "local")),
        el("div", { class: "caja" }, el("span", { class: "cifra" }, pc(pr.empate)), el("span", { class: "et" }, "empate")),
        el("div", { class: "caja" }, el("span", { class: "cifra" }, pc(pr.visitante)), el("span", { class: "et" }, "visitante"))),
      nota(lectura ? lectura[0].toUpperCase() + lectura.slice(1) + "." : null)));
  } else if (pv.mercado && pv.mercado.nota) partes.push(nota(pv.mercado.nota));

  for (const lado of ["local", "visitante"]) {
    const e = (pv.equipos || {})[lado];
    const nombre = (pv.partido || {})[lado] || (lado === "local" ? p.local : p.visitante);
    if (!e) continue;
    if (!e.disponible) {
      partes.push(el("div", { class: "bloque" }, el("h3", {}, nombre), msg(e.nota, "ojo")));
      continue;
    }
    const r = e.resultados;
    const jugadores = ((pv.jugadores || {})[lado] || []).filter((j) => (j.rachas || []).length);
    partes.push(el("div", { class: "bloque" },
      el("div", { class: "titular" }, el("h3", {}, nombre),
        el("span", { class: "resto fila peq gris", style: "gap:7px" }, forma(r.racha),
          `${r.goles_favor}-${r.goles_contra} en ${e.partidos_mirados}`,
          el("a", { href: `#/buscar/equipo/${encodeURIComponent(nombre)}` }, "ver →"))),
      rasgos(e.dimensiones, 4),
      jugadores.length ? el("ul", { class: "lista" }, ...jugadores.slice(0, 3).map((j) =>
        el("li", {}, el("a", { href: `#/buscar/jugador/${encodeURIComponent(j.jugador)}` }, j.jugador),
          el("span", { class: "gris peq" }, j.rachas.join(" · "))))) : null));
  }

  if ((pv.donde_se_hacen_dano || []).length)
    partes.push(el("div", { class: "bloque" }, el("h3", {}, "Dónde se pueden hacer daño"),
      el("ul", { class: "lista" }, ...pv.donde_se_hacen_dano.slice(0, 4).map((c) => el("li", {}, c.aviso)))));

  const duelos = (p.datos && p.datos.duelos) || [];
  if (duelos.length)
    partes.push(el("div", { class: "bloque" }, el("h3", {}, "Jugador contra sistema"),
      el("ul", { class: "lista" }, ...duelos.slice(0, 5).map((d) => el("li", {},
        veredicto(d.veredicto),
        el("span", { style: "flex:1 1 200px;min-width:0" },
          el("a", { href: `#/buscar/duelo/${encodeURIComponent(d.jugador)}/${encodeURIComponent(d.rival)}` }, d.jugador),
          ` contra ${d.el_rival_es}: ${d.metrica.replace(/_/g, " ")} `,
          el("b", {}, d.por_90), `/90 frente a ${d.su_media}`),
        el("span", { class: "gris peq" }, `${d.partidos} partidos`))))));

  const a = pv.arbitro || {};
  partes.push(el("div", { class: "bloque" }, el("h3", {}, "Árbitro"),
    a.disponible
      ? el("div", { class: "bloque" },
          el("div", { class: "fila" }, el("b", {}, a.arbitro),
            el("span", { class: "gris peq" }, `${a.partidos_mirados} partidos vistos`)),
          cifras([[a.por_partido.amarillas, "amarillas"], [a.por_partido.rojas, "rojas"],
                  [a.por_partido.penaltis, "penaltis"], [a.por_partido.faltas, "faltas"]]),
          nota(a.aviso))
      : nota(a.nota || "Sin árbitro designado todavía.")));

  partes.push(el("div", { class: "fila" },
    el("a", { class: "btn plano s", href: `#/buscar/partido/${p.id}` }, "Abrir el partido entero"),
    (pv.memoria || {}).consejo ? el("span", { class: "gris peq" }, pv.memoria.consejo) : null));
  // Si la previa se ha montado con poca memoria, el sitio de arreglarlo es
  // aquí mismo, no un mensaje que te manda a otra pantalla a adivinar.
  if ((pv.memoria || {}).consejo) partes.push(abastecer(p.id));
  return partes;
}

/* ── CASI SEGURO ─────────────────────────────────────────────────── */
V.seguro = async (raiz, [modo, fechaRuta]) => {
  modo = modo === "calibrar" ? "calibrar" : "hoy";
  const fecha = fechaRuta || leer("fecha", hoy());
  raiz.replaceChildren(
    el("div", { class: "titular" }, el("h1", {}, "Casi seguro"),
      el("div", { class: "resto fila" },
        modo === "hoy" ? el("input", { class: "campo", type: "date", id: "s-fecha", value: fecha,
          style: "flex:0 1 148px",
          onchange: (e) => { guardar("fecha", e.target.value); ir(`#/seguro/hoy/${e.target.value}`, true); } }) : null,
        el("div", { class: "seg" },
          el("button", { class: modo === "hoy" ? "on" : "", onclick: () => ir(`#/seguro/hoy/${fecha}`) }, "Hoy"),
          el("button", { class: modo === "calibrar" ? "on" : "", onclick: () => ir("#/seguro/calibrar") }, "Los patrones"),
          el("button", { class: modo === "acierto" ? "on" : "", onclick: () => ir("#/seguro/acierto") }, "Cómo acierto")))),
    msg("Aquí no hay apuestas seguras: hay frecuencias contadas sobre lo que tienes guardado, con "
      + "su número de casos y su suelo de confianza. Si un patrón coincide con la tasa base, se dice.", "ojo"),
    espera(modo === "hoy" ? "Midiendo lo de hoy…" : "Contando el historial…"));

  /* El registro: lo que se predijo antes de cada partido y cómo acabó. Va aquí
     porque es la misma idea que lo de al lado —medirse en vez de creerse— y
     porque un pronóstico sin su historial de aciertos no se puede juzgar. */
  if (modo === "acierto") {
    raiz.lastChild.remove();
    const b = await api.h("como_acierta", {});
    if (fallo(b)) { raiz.append(fallo(b)); return; }
    if (!b.casos) {
      raiz.append(tarjeta(null, msg(b.nota, "ojo"),
        nota("Se apuntan solas cuando la guardia prepara el día siguiente, y se "
          + "resuelven cuando el partido ya se ha jugado.")));
      return;
    }
    const desvio = (t) => `${t.desvio > 0 ? "+" : ""}${pc(t.desvio)}`;
    raiz.append(tarjeta("Calibración",
      el("p", { class: "peq gris" },
        `De las veces que dijo X, cuántas pasó. ${b.casos} predicciones resueltas `
        + `(${b.desde} → ${b.hasta}).`),
      el("ul", { class: "lista" }, ...b.calibracion.map((t) => el("li", {},
        el("span", { style: "flex:0 0 76px" }, t.tramo),
        el("span", { style: "flex:1 1 160px;min-width:0" },
          `dijo ${pc(t.dijiste)} · pasó `, el("b", {}, pc(t.paso))),
        el("span", { class: Math.abs(t.desvio) < 0.05 ? "gris peq" : "peq" }, desvio(t)),
        el("span", { class: "gris peq" }, `${t.casos} casos`)))),
      nota("Un pronóstico calibrado dice 70 % y acierta el 70 %. Uno que dice 70 % "
        + "y acierta el 95 % no es mejor: está mal escrito.")));

    const marca = (v, ref) => el("b", { style: `color:var(--${v < ref ? "cesped" : "bandera"})` }, v);
    raiz.append(tarjeta("Las cuentas",
      el("ul", { class: "lista" },
        el("li", {}, el("span", { style: "flex:1 1 200px" }, "Brier (menos es mejor)"),
          marca(b.brier, b.brier_de_no_saber_nada),
          el("span", { class: "gris peq" }, `quien no sabe nada: ${b.brier_de_no_saber_nada}`)),
        el("li", {}, el("span", { style: "flex:1 1 200px" }, "Log loss"),
          el("b", {}, b.log_loss)),
        el("li", {}, el("span", { style: "flex:1 1 200px" }, "Acierto"),
          el("b", {}, pc(b.acierto)),
          el("span", { class: "gris peq" },
            `${b.aciertos}/${b.casos} · entre ${pc(b.acierto_suelo)} y ${pc(b.acierto_techo)}`))),
      b.contra_el_mercado && b.contra_el_mercado.casos
        ? msg(`Contra el mercado: ${b.contra_el_mercado.brier_nuestro} nuestro contra `
            + `${b.contra_el_mercado.brier_del_mercado} suyo, en `
            + `${b.contra_el_mercado.casos} casos. ${b.contra_el_mercado.lectura}`,
            b.contra_el_mercado.diferencia > 0 ? "bien" : "ojo")
        : nota((b.contra_el_mercado || {}).nota || ""),
      b.clv && b.clv.casos ? nota(b.clv.lectura) : null,
      !b.suficiente
        ? msg(`Con ${b.casos} casos esto es un indicio, no un juicio.`, "ojo") : null,
      nota(b.como_leerlo), nota(b.lo_que_no_dice)));

    const filas = Object.entries(b.por_mercado || {});
    if (filas.length) {
      raiz.append(tarjeta("Por mercado", el("ul", { class: "lista" },
        ...filas.map(([nombre, m]) => el("li", {},
          el("span", { style: "flex:1 1 140px" }, nombre),
          el("span", { class: "gris peq" }, `${m.casos} casos`),
          el("span", {}, `Brier ${m.brier}`),
          el("span", { class: "gris peq" }, `${m.aciertos} aciertos`))))));
    }
    if ((b.pendientes || {}).sin_resolver) {
      raiz.append(nota(`${b.pendientes.sin_resolver} predicciones esperando a que se `
        + "juegue el partido."));
    }
    return;
  }

  const d = await api.post("/api/seguro", modo === "calibrar" ? { calibrar: true } : { fecha, umbral: 0.65 });
  raiz.lastChild.remove();
  if (fallo(d)) { raiz.append(fallo(d)); return; }

  if (modo === "calibrar") {
    raiz.append(tarjeta(null,
      el("p", { class: "peq gris" }, `Calibrado sobre ${d.partidos_mirados} partidos guardados.`),
      el("div", { class: "desliza" }, el("table", { class: "tb" },
        el("thead", {}, el("tr", {}, el("th", {}, "Patrón"), el("th", { class: "n" }, "Casos"),
          el("th", { class: "n" }, "Frec."), el("th", { class: "n" }, "Suelo"),
          el("th", { class: "n" }, "Elev."), el("th", {}, ""), el("th", {}, "Después"))),
        el("tbody", {}, ...d.patrones.map((m) => el("tr", {},
          el("td", {}, el("div", {}, m.titulo), el("div", { class: "gris peq" }, m.pregunta)),
          el("td", { class: "n" }, m.casos),
          el("td", { class: "n" }, m.frecuencia === null ? "—" : pc(m.frecuencia)),
          el("td", { class: "n" }, m.casos ? pc(m.suelo) : "—"),
          el("td", { class: "n" }, m.casos ? (m.elevacion > 0 ? "+" : "") + pc(m.elevacion) : "—"),
          el("td", {}, veredicto(m.veredicto)),
          el("td", {}, fueraDeMuestra(m.fuera_de_muestra))))))),
      ...d.patrones.filter((m) => m.nota).map((m) => nota(`${m.titulo}: ${m.nota}`)),
      el("hr", { class: "hr" }),
      el("details", {}, el("summary", {}, "La comprobación fuera de muestra, patrón a patrón"),
        el("ul", { class: "lista" }, ...d.patrones.filter((m) => m.fuera_de_muestra)
          .map((m) => el("li", {}, fueraDeMuestra(m.fuera_de_muestra),
            el("span", { style: "flex:1 1 200px;min-width:0" },
              el("b", {}, m.titulo), " ", m.fuera_de_muestra.lectura))))),
      nota(d.como_leerlo), nota(d.lo_que_no_dice)));
    return;
  }

  if (!(d.avisos || []).length) {
    raiz.append(vacio('<path d="M12 3l7 3v6c0 4-3 7.5-7 9-4-1.5-7-5-7-9V6z"/><path d="M9 12l2 2 4-4"/>',
      "Hoy no se cumple nada que aguante el recuento",
      el("p", { class: "gris peq", style: "max-width:46ch" },
        "Un patrón sale aquí si tiene al menos 30 casos, un suelo por encima del 65 % y se separa "
        + `de su referencia. Calibrado con ${d.calibrado_con} partidos guardados.`),
      el("div", { class: "fila" },
        el("a", { class: "btn plano s", href: "#/seguro/calibrar" }, "Ver los patrones"),
        el("a", { class: "btn plano s", href: "#/memoria" }, "Barrer más partidos"))));
    return;
  }
  /* Un patrón se mide UNA vez sobre todo el historial. Cuando se cumple en
     sesenta partidos del día, enseñarlo por partido daba sesenta fichas con la
     misma frecuencia, los mismos casos y el mismo suelo, y solo cambiaba el
     nombre del equipo: parecía roto. Así que el patrón va una vez, con su
     medición, y debajo los partidos donde se cumple, ordenados por lo único
     que los distingue: cuánto se separan del precio del mercado. */
  const VISIBLES = 8;
  for (const g of d.por_patron || []) {
    const c = tarjeta(null, el("div", { class: "titular" },
      el("h2", {}, g.titulo),
      el("span", { class: "resto gris peq" },
        `${g.cuantos_partidos} partido${g.cuantos_partidos === 1 ? "" : "s"} hoy`)));
    c.append(el("div", { class: "av " + (g.suelo >= 0.8 ? "alto" : "medio") },
      el("div", { class: "cab" }, el("span", { class: "pc" }, pc(g.suelo)),
        el("span", { style: "flex:1 1 220px;min-width:0" }, g.dice),
        veredicto(g.veredicto), fueraDeMuestra(g.fuera_de_muestra)),
      el("div", { class: "barra-conf", title: `frecuencia ${pc(g.frecuencia)} · suelo ${pc(g.suelo)}` },
        el("i", { style: `width:${(g.suelo || 0) * 100}%` }),
        el("b", { style: `left:calc(${(g.frecuencia || 0) * 100}% - 1px)` })),
      el("div", { class: "fila peq gris" }, `${pc(g.frecuencia)} en ${g.casos} casos`,
        el("span", {}, `${g.elevacion > 0 ? "+" : ""}${pc(g.elevacion)} sobre su referencia`)),
      g.fuera_de_muestra ? nota(g.fuera_de_muestra.lectura) : null));
    const filas = el("ul", { class: "lista" });
    const pintaFila = (p) => filas.append(el("li", {},
      el("span", { class: "gris peq", style: "flex:0 0 42px" }, p.hora || p.hora_utc || ""),
      el("a", { style: "flex:1 1 200px;min-width:0",
        href: `#/buscar/partido/${p.partido_id}` }, p.partido),
      p.sujeto && p.sujeto !== "el partido"
        ? el("span", { class: "peq" }, p.sujeto) : null,
      /* La diferencia con el mercado, y con qué se compara: el mercado dice
         «que gane» o «que no pierda», y mezclarlos era la mitad del error. */
      p.mercado === null || p.mercado === undefined
        ? el("span", { class: "gris peq" }, "sin cuotas")
        : el("span", { class: "peq" + (Math.abs(p.diferencia) >= 0.1 ? "" : " gris") },
            `mercado ${pc(p.mercado)} (${p.mercado_de})`,
            el("b", { style: "margin-left:6px" },
              `${p.diferencia > 0 ? "+" : ""}${pc(p.diferencia)}`))));
    (g.partidos || []).slice(0, VISIBLES).forEach(pintaFila);
    c.append(filas);
    if ((g.partidos || []).length > VISIBLES) {
      const resto = g.partidos.slice(VISIBLES);
      c.append(el("details", {},
        el("summary", {}, `Los otros ${resto.length}`),
        el("div", {}, el("ul", { class: "lista" },
          ...resto.map((p) => el("li", {},
            el("span", { class: "gris peq", style: "flex:0 0 42px" }, p.hora || p.hora_utc || ""),
            el("a", { style: "flex:1 1 200px;min-width:0",
              href: `#/buscar/partido/${p.partido_id}` }, p.partido),
            p.mercado === null || p.mercado === undefined ? null
              : el("span", { class: "gris peq" },
                  `${p.diferencia > 0 ? "+" : ""}${pc(p.diferencia)}`)))))));
    }
    c.append(nota("La frecuencia y el suelo son del patrón, medidos sobre todo el "
      + "historial: son los mismos en todos estos partidos. Lo que cambia de uno a "
      + "otro es el precio de hoy, y por eso están ordenados por ahí."));
    raiz.append(c);
  }
  raiz.append(nota(d.lo_que_no_dice));
};

    onkeydown: (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); } },
    oninput: (e) => { e.target.style.height = "auto";
      e.target.style.height = Math.min(140, e.target.scrollHeight) + "px"; } });
  const boton = el("button", { class: "btn", onclick: () => enviar() }, "Preguntar");
  const sugeridas = el("div", { class: "sugeridas" }, ...SUGERENCIAS.map((s) =>
    el("button", { class: "sug", type: "button", onclick: () => { caja.value = s; enviar(); } }, s)));
  const avisoOllama = el("div", {});

  raiz.replaceChildren(el("div", { class: "titular" }, el("h1", {}, "Analista"),
    el("span", { class: "resto gris peq", id: "modelo" }, "")),
    avisoOllama, hilo, sugeridas, el("div", { class: "redactar" }, caja, boton));

  const estado = await api.get("/api/analista");
  $("#modelo").textContent = (estado && estado.modelo) || "";
  if (!estado || estado.disponible === false) {
    avisoOllama.replaceChildren(el("div", { class: "msg mal" },
      el("div", {}, (estado && (estado.nota || estado.error)) || "Ollama no contesta."),
      el("div", { class: "peq", style: "margin-top:6px" }, "Instálalo desde ",
        el("a", { href: "https://ollama.com", target: "_blank", rel: "noopener" }, "ollama.com"),
        ", arráncalo y trae un modelo que sepa llamar funciones:"),
      el("pre", { class: "registro", style: "margin-top:6px" }, "ollama pull hermes3")));
    boton.disabled = true;
  } else if (estado.instalado === false) {
    avisoOllama.replaceChildren(msg(estado.nota, "ojo"));
  }

  let historial = leer("hilo", null);
  let ocupado = false;
  if (historial) hilo.append(el("div", { class: "fila" },
    el("span", { class: "gris peq" }, "Hay una conversación anterior guardada."),
    el("button", { class: "btn plano s", onclick: () => {
      historial = null; guardar("hilo", null); hilo.replaceChildren(); sugeridas.hidden = false;
    } }, "Empezar de cero")));

  async function enviar() {
    const pregunta = caja.value.trim();
    if (!pregunta || ocupado) return;
    ocupado = true; boton.disabled = true; caja.value = ""; caja.style.height = "auto";
    sugeridas.hidden = true;
    hilo.append(el("div", { class: "burbuja yo" }, el("div", { class: "txt" }, pregunta)));
    const pasos = el("div", { class: "pasos" }, el("span", { class: "paso vivo" }, "pensando…"));
    const texto = el("div", { class: "txt" }, espera("…"));
    const burbuja = el("div", { class: "burbuja el" }, pasos, texto);
    hilo.append(burbuja);
    burbuja.scrollIntoView({ block: "end", behavior: "smooth" });

    try {
      const r = await fetch("/api/analista", { method: "POST", headers: api.cab(),
        body: JSON.stringify({ pregunta, historial }) });
      if (!r.ok || !r.body) throw new Error(`El servidor no ha aceptado la pregunta (${r.status}).`);
      const lector = r.body.getReader(), dec = new TextDecoder();
      let resto = "";
      for (;;) {
        const trozo = await lector.read();
        if (trozo.done) break;
        resto += dec.decode(trozo.value, { stream: true });
        const lineas = resto.split("\n"); resto = lineas.pop() || "";
        for (const linea of lineas) {
          if (!linea.trim()) continue;
          let ev;
          try { ev = JSON.parse(linea); } catch (e) { continue; }
          if (ev.error) { texto.replaceChildren(msg(ev.error, "mal")); pasos.replaceChildren(); }
          if (ev.paso) {
            const p = ev.paso;
            pasos.querySelectorAll(".vivo").forEach((n) => n.classList.remove("vivo"));
            if (p.tipo === "herramienta")
              pasos.append(el("span", { class: "paso vivo", title: JSON.stringify(p.argumentos || {}) }, p.nombre));
            else if (p.tipo === "resultado") {
              const ultimo = pasos.lastElementChild;
              if (ultimo) ultimo.textContent = `${p.nombre} · ${p.caracteres}c`;
            } else if (p.tipo === "aviso") pasos.append(el("span", { class: "paso" }, p.texto));
            else if (p.tipo === "respuesta") texto.replaceChildren(p.texto || "(sin respuesta)");
          }
          if (ev.fin) { historial = ev.fin.historial; guardar("hilo", historial); }
        }
      }
      if (texto.querySelector(".espera")) texto.replaceChildren(msg("No ha llegado respuesta.", "ojo"));
    } catch (e) {
      texto.replaceChildren(msg(e.message, "mal"));
    } finally {
      pasos.querySelectorAll(".vivo").forEach((n) => n.classList.remove("vivo"));
      ocupado = false; boton.disabled = false; caja.focus();
      burbuja.scrollIntoView({ block: "end", behavior: "smooth" });
    }
  }
};

V.buscar = async (raiz, partes) => {
  const modos = ["partido", "equipo", "jugador", "liga", "duelo"];
  const modo = modos.indexOf(partes[0]) >= 0 ? partes[0] : leer("modo", "partido");
  const arg = partes[1] ? decodeURIComponent(partes[1]) : "";
  const arg2 = partes[2] ? decodeURIComponent(partes[2]) : "";
  guardar("modo", modo);

  raiz.replaceChildren(el("div", { class: "titular" }, el("h1", {}, "Buscar"),
    el("span", { class: "resto" }, el("div", { class: "seg" },
      ...modos.map((v) => el("button", { class: v === modo ? "on" : "",
        onclick: () => ir(`#/buscar/${v}`) }, v[0].toUpperCase() + v.slice(1)))))));

  if (modo === "duelo") {
    const j = el("input", { class: "campo", id: "d-jug", placeholder: "Jugador", value: arg, autocomplete: "off" });
    const r = el("input", { class: "campo", id: "d-riv", placeholder: "Equipo rival", value: arg2, autocomplete: "off" });
    raiz.append(el("form", { class: "busca", onsubmit: (e) => { e.preventDefault();
      if (j.value.trim() && r.value.trim())
        ir(`#/buscar/duelo/${encodeURIComponent(j.value.trim())}/${encodeURIComponent(r.value.trim())}`, true); } },
      j, r, el("button", { class: "btn", type: "submit" }, "Ver")));
    if (!arg || !arg2) { raiz.append(nota("Qué le ha pasado a ese jugador contra lo que ese rival suele plantear.")); return; }
    return pintarDuelo(raiz, arg, arg2);
  }

  const marcadores = { partido: "Real Madrid vs Barcelona, una URL o un id",
    equipo: "Girona, Real Madrid, un id…", jugador: "Vinicius, Lewandowski, un id…",
    liga: "laliga, premier, champions, liga_f…" };
  const caja = el("input", { class: "campo", type: "search", id: "q", value: arg,
    placeholder: marcadores[modo], autocomplete: "off", enterkeyhint: "search" });
  raiz.append(el("form", { class: "busca", onsubmit: (e) => { e.preventDefault();
    if (caja.value.trim()) ir(`#/buscar/${modo}/${encodeURIComponent(caja.value.trim())}`, true); } },
    caja, el("button", { class: "btn", type: "submit" }, "Buscar")));

  if (!arg) {
    raiz.append(nota({ partido: "El informe entero de un partido: estadísticas, xG, tiros y contexto.",
      equipo: "Cómo juega comparado con su liga, con qué plantea y si ha cambiado.",
      jugador: "Forma, rachas y cómo rinde según el sistema que le pongan delante.",
      liga: "Clasificación, histórico de resultados, ranking Elo y las tablas de FBref." }[modo]));
    if (modo === "liga") raiz.append(el("div", { class: "fila" },
      ...["laliga", "premier", "serie_a", "bundesliga", "ligue_1", "champions", "liga_f", "mls"]
        .map((x) => el("button", { class: "sug", onclick: () => ir(`#/buscar/liga/${x}`) }, x))));
    return;
  }
  if (modo === "partido") return pintarPartido(raiz, arg);
  if (modo === "equipo") return pintarEquipo(raiz, arg);
  if (modo === "liga") return pintarLiga(raiz, arg);
  return pintarJugador(raiz, arg);
};

  const CLAVES = new Map([["ballPossession", "Posesión"], ["expectedGoals", "xG"],

  const ext = el("div", { class: "bloque" });
  raiz.append(tarjeta("Otras fuentes", ext, el("button", { class: "btn plano s", style: "justify-self:start",

      const fs = [];

      const fuentes = c.fuentes || {};
      const u = fuentes.understat, elo = fuentes.clubelo, fd = fuentes.futboldata;
      if (u && u.estado === "ok" && u.xg)
        fs.push({ nombre: "xG Understat", local: u.xg.local, visitante: u.xg.visitante });
      ext.replaceChildren(
        fs.length ? comparar(fs, p.home.name, p.away.name) : nota(u && u.nota),
        nota(c.contraste_xg && c.contraste_xg.lectura),
        elo && elo.estado === "ok" ? el("p", { class: "peq" },
          `Elo: ${elo.local.equipo} ${elo.local.elo} (#${elo.local.puesto}) · `

          const err = fallo(t);

            tabla([{ t: "'", k: "minuto", n: true }, { t: "Jugador", k: "jugador" },
              { t: "Equipo", k: "equipo" }, { t: "xG", k: "xg", n: true },
              { t: "Final", k: "resultado" }, { t: "Con", k: "parte_del_cuerpo" }],
              t.tiros || [], (f, c) => c.k === "xg" ? n2(f.xg) : f[c.k])];
        }) : null);
    } }, "Cruzar con Understat, ClubElo y football-data")));
}

/* El dictamen: se monta el expediente entero —que es mucho texto— y se le da
   de una vez a un modelo para que ate cabos. Es lo más caro que hace la
   página, así que no se pide solo: hay que darle al botón. */
/* El dictamen, y lo que ya se dictaminó antes. Lo que dice un modelo se guarda
   atado al id del partido: cuesta dinero y tiempo, y sobre todo es lo que dijo
   **entonces**, con la memoria que había entonces. Volver mañana y encontrarlo
   igual es la mitad de su valor. */
function tarjetaDictamen(consulta) {
  const cuerpo = el("div", { class: "bloque" });
  const guardados = el("div", { class: "bloque" });
  const boton = el("button", { class: "btn", type: "button" }, "Pedir el dictamen");
  const crudo = el("select", { class: "campo", style: "flex:0 1 210px" },
    el("option", { value: "todo" }, "con todas las estadísticas"),
    el("option", { value: "tabla" }, "con una tabla por partido"),
    el("option", { value: "no" }, "sin datos en crudo"));

  const pintarUno = (d, viejo) => [
    el("div", { class: "fila peq gris" },
      etiqueta(d.modelo || "?", "azul"),
      viejo ? el("span", {}, d.hecho_el) : null,
      el("span", {}, `${(d.expediente ? d.expediente.tokens_aprox
        : Math.round((d.caracteres || 0) / 4))} tokens de expediente`),
      d.en_la_nube ? etiqueta("en la nube", "ambar") : etiqueta("en tu máquina", "verde"),
      d.tokens_prompt ? el("span", {}, `${d.tokens_prompt} tokens cobrados`) : null),
    el("div", { class: "bloque" }, ...(d.respuesta || "").split("\n\n")
      .filter((p) => p.trim()).map((p) => el("p", {}, p))),
    d.expediente && d.expediente.texto
      ? el("details", {}, el("summary", {}, "El expediente que se le ha dado"),
          el("pre", { class: "registro" }, d.expediente.texto))
      : null,
  ];

  const traerGuardados = async () => {
    const r = await api.post("/api/dictamenes", { partido: String(consulta) });
    if (fallo(r) || !r.cuantos) return;
    poner(guardados,
      el("p", { class: "peq gris" },
        `${r.cuantos} dictamen${r.cuantos === 1 ? "" : "es"} guardado`
        + `${r.cuantos === 1 ? "" : "s"} de este partido:`),
      ...r.dictamenes.map((d, i) => el("div", { class: "bloque" },
        i === 0 ? el("div", {}, ...pintarUno(d, true))
          : el("details", {},
              el("summary", {}, `${d.hecho_el} · ${d.modelo || "?"}`),
              el("div", {}, ...pintarUno(d, true))))));
    boton.textContent = "Pedir otro";
  };

  boton.addEventListener("click", async () => {
    boton.disabled = true;
    boton.textContent = "Pensando…";
    cuerpo.replaceChildren(espera("Montando el expediente y mandándolo al modelo. "
      + "Con uno grande esto tarda; puedes irte a otra pantalla."));
    const d = await api.post("/api/dictamen",
      { partido: String(consulta), crudo: crudo.value });
    boton.disabled = false;
    boton.textContent = "Pedir otro";
    const err = fallo(d);
    if (err) { cuerpo.replaceChildren(err); return; }
    poner(cuerpo, ...pintarUno(d, false),
      d.guardado ? nota("Guardado con el partido: mañana seguirá aquí.") : null,
      nota("Los números del expediente los calcula el programa; el modelo solo "
        + "ata cabos. Si dice una cifra que no está ahí, se la ha inventado."));
    guardados.replaceChildren();
    traerGuardados();
  });

  traerGuardados();
  return tarjeta("Dictamen", guardados, cuerpo,
    el("div", { class: "fila" }, boton, crudo),
    nota("Le da al modelo todo lo que se sabe del partido de una vez, en vez de "
      + "que lo pida a cachitos: el pronóstico, los perfiles, los patrones y —con "
      + "«todas las estadísticas»— los números partido a partido de todo lo que "
      + "tienes guardado. Con un modelo grande es donde se nota."));
}

/* El pronóstico: marcador, córners y tarjetas. Los números salen calculados
   del servidor; aquí solo se pintan. Se pide al abrir, no antes: es lo caro. */
function tarjetaPronostico(consulta) {
  const cuerpo = el("div", { class: "bloque" });
  return tarjeta("Pronóstico", plegable("Marcador, córners y tarjetas", async () => {
    const d = await api.h("pronostico_partido", { partido: String(consulta) });
    const err = fallo(d);
    if (err) return err;
    const g = d.goles, c = d.corners || {}, t = d.tarjetas || {}, m = d.mercado || {};
    const linea = (obj) => el("div", { class: "fila peq" }, ...Object.entries(obj)
      .map(([k, v]) => etiqueta(`+${k}: ${pc(v)}`)));
    return [
      el("div", { class: "tres" },
        ...["local", "empate", "visitante"].map((k) => el("div", { class: "caja" },
          el("span", { class: "cifra" }, pc(g["1x2"][k])), el("span", { class: "et" }, k)))),
      cifras([[n2(g.esperados.local), "goles esperados (L)"],
        [n2(g.esperados.visitante), "goles esperados (V)"],
        [g.medido_en, "medido en"]]),
      el("div", { class: "bloque" }, el("b", {}, "Marcadores más probables"),
        el("div", { class: "fila" }, ...g.marcadores.slice(0, 6).map((x) =>
          etiqueta(`${x.marcador} · ${pc(x.probabilidad, 1)}`,
            x === g.marcadores[0] ? "verde" : "")))),
      el("div", { class: "bloque" }, el("b", {}, "Goles"), linea(g.mas_de),
        el("p", { class: "peq gris" }, `Marcan los dos: ${pc(g.ambos_marcan)}`)),
      c.disponible
        ? el("div", { class: "bloque" }, el("b", {}, `Córners: ${c.esperado_total}`),
            linea(c.mas_de))
        : nota(c.nota),
      t.disponible
        ? el("div", { class: "bloque" },
            el("b", {}, `Amarillas: ${t.esperado_total_con_arbitro}`),
            linea(t.mas_de),
            nota((t.arbitro || {}).lectura || (t.arbitro || {}).nota))
        : nota(t.nota),
      m.disponible
        ? el("div", { class: "bloque" }, el("b", {}, "Contra el mercado"),
            el("div", { class: "tres" }, ...["local", "empate", "visitante"].map((k) =>
              el("div", { class: "caja" }, el("span", { class: "cifra" }, pc(m.mercado[k])),
                el("span", { class: "et" }, k)))),
            nota(m.lectura))
        : nota(m.nota),
      nota(d.como_se_calcula),
      msg(d.lo_que_no_dice, "ojo"),
    ];
  }), cuerpo);
}

        tramos.length ? tabla([{ t: "Desde", k: "desde" }, { t: "Hasta", k: "hasta" },

  const not = el("div", {});

    } }, "Noticias (ESPN)")));
}

          el("a", { href: `#/buscar/equipo/${encodeURIComponent(eq.name)}` }, eq.name)) : null,
        el("details", {}, el("summary", {}, "Todo en crudo"), volcado(d)),
      ];

  if ((fm.partido_a_partido || []).length) raiz.append(tarjeta("Partido a partido",
    tabla([{ t: "Fecha", k: "fecha" }, { t: "Partido", k: "partido" }, { t: "′", k: "minutos", n: true },
      { t: "Nota", k: "rating", n: true }, { t: "G", k: "goles", n: true }, { t: "A", k: "asistencias", n: true },
      { t: "Tiros", k: "tiros", n: true }, { t: "xG", k: "xg", n: true }],
      fm.partido_a_partido, (f, col) => col.k === "xg" ? n2(f.xg) : f[col.k])));
}

      ? tabla([{ t: "#", k: "posicion", n: true }, { t: "Equipo", k: "equipo" },
          { t: "PJ", k: "jugados", n: true }, { t: "G", k: "ganados", n: true },
          { t: "E", k: "empatados", n: true }, { t: "P", k: "perdidos", n: true },

          { t: "Pts", k: "puntos", n: true }], filas,
          (f, c) => c.k === "equipo"
            ? el("a", { href: `#/buscar/equipo/${encodeURIComponent(f.equipo || "")}` }, f.equipo)

async function pintarDuelo(raiz, jugador, rival) {
  raiz.append(espera("Midiendo al rival y buscando al jugador…"));
  const d = await api.h("duelo_jugador_rival", { jugador, rival });
  raiz.lastChild.remove();
  if (fallo(d)) { raiz.append(fallo(d)); return; }
  const rv = d.rival;
  raiz.append(tarjeta(null, el("h2", {}, `${d.jugador} contra ${rv.equipo}`),
    el("p", { class: "peq gris" }, `${rv.equipo} en sus últimos ${rv.partidos}: `
      + (Object.entries(rv.formaciones || {}).map((par) => `${par[0]} ×${par[1]}`).join(", ") || "sin alineaciones")
      + ` · ${n2(rv.posesion, 0)}% posesión · presión ${n2(rv.presion, 1)} · concede ${n2(rv.xg_concedido)} xG`)));
  for (const [eje, b] of Object.entries(d.por_eje || {})) {
    const c = tarjeta(`${eje}: ${b.el_rival_es}`);
    const s = b.resumen;
    if (!s) { c.append(nota("Este jugador no se ha medido nunca a eso, de lo que hay guardado.")); raiz.append(c); continue; }
    const fav = s.siendo_favorito || {};
    c.append(el("p", { class: "peq gris" },
      `${s.partidos} partidos · ${s.minutos}′ · nota ${s.rating === null || s.rating === undefined ? "—" : s.rating}`
      + (fav.favorito === undefined || fav.favorito === null ? "" : ` · favorito en ${fav.favorito}`)));
    c.append((s.relevante || []).length
      ? el("ul", { class: "lista" }, ...s.relevante.map((h) => el("li", {}, veredicto(h.veredicto),
          el("span", { style: "flex:1 1 180px;min-width:0" }, `${h.metrica.replace(/_/g, " ")}: `,
            el("b", {}, h.por_90), `/90 frente a ${h.su_media}`),
          el("span", { class: "gris peq" }, `p=${h.p}`))))
      : nota("Nada que no explique el azar."));
    c.append(el("p", { class: "gris peq" }, "Contra: "
      + s.contra.map((x) => `${x.rival} (${String(x.fecha).slice(5)})`).join(", ")));
    raiz.append(c);
  }
  raiz.append(nota(d.lo_que_no_dice));
}
